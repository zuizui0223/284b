name: authorized-sampling-preflight

# Retriggered only because the first attempt stopped in pre-occurrence unit tests.
on:
  push:
    branches:
      - product-b-v5-obligate-invariant
    paths:
      - .github/workflows/authorized_sampling_preflight.yml

permissions:
  contents: read

jobs:
  one-shot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify frozen code before opening occurrences
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v

      - name: Run authorized OPM_FIG_001 sampling preflight
        env:
          PYTHONPATH: .
        run: python scripts/run_authorized_sampling_preflight.py

      - name: Upload terminal sampling-preflight audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-b-v5-sampling-preflight-outcome
          path: artifacts/product_b_v5_sampling_preflight_outcome.json
          if-no-files-found: error
          retention-days: 90
