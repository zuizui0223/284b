name: Original GBIF 2026-08-01 object-manifest replay
on:
  push:
    branches: [analysis/neon-external-truth-preflight-20261115]
    paths:
      - 'scripts/check_original_gbif_object_manifest_v1.py'
      - 'tests/test_gbif_object_manifest_replay_v1.py'
      - '.github/workflows/check_original_gbif_object_manifest_v1.yml'
permissions:
  contents: write
concurrency:
  group: gbif-monthly-object-manifest-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-frozen-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test original frozen object-manifest semantics (no occurrence rows)
        run: python -m unittest discover -s tests -p 'test_gbif_object_manifest_replay_v1.py' -v
      - name: Replay public S3 object ETag/size/listing for exact frozen GBIF snapshot
        run: |
          python scripts/check_original_gbif_object_manifest_v1.py \
            --out results/neon_original_gbif_manifest_replay_v1.json
      - name: Archive metadata receipt whether match or mismatch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gbif-snapshot-manifest-replay-v1
          path: results/neon_original_gbif_manifest_replay_v1.json
          if-no-files-found: warn
      - name: Commit audit metadata and preserve branch history
        if: always()
        run: |
          if [ ! -f results/neon_original_gbif_manifest_replay_v1.json ]; then
            echo "No metadata receipt; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/neon_original_gbif_manifest_replay_v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record rechecked GBIF monthly snapshot manifest fingerprint"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
