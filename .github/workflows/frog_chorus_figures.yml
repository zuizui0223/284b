name: frog chorus submission figures

on:
  push:
    branches:
      - incubator/frog-chorus-synchrony-v1
    paths:
      - "incubator/frog_chorus_synchrony/FIGURE_SPEC_V0_1.md"
      - "incubator/frog_chorus_synchrony/scripts/build_submission_figures.py"
      - "incubator/frog_chorus_synchrony/*RECEIPT*.json"
      - ".github/workflows/frog_chorus_figures.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  figures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build deterministic SVG figures
        run: python incubator/frog_chorus_synchrony/scripts/build_submission_figures.py
      - name: XML smoke test
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for p in Path("incubator/frog_chorus_synchrony/figures").glob("*.svg"):
              ET.parse(p)
              print(p)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frog-chorus-submission-figures-v0-1
          path: incubator/frog_chorus_synchrony/figures/*.svg
          if-no-files-found: error
