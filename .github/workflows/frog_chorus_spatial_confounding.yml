name: frog chorus spatial confounding robustness

on:
  push:
    branches:
      - incubator/frog-chorus-synchrony-v1
    paths:
      - "incubator/frog_chorus_synchrony/SPATIAL_CONFOUNDING_ROBUSTNESS_CONTRACT_V0_1.json"
      - "incubator/frog_chorus_synchrony/scripts/run_naamp_within_route_robustness.py"
      - "incubator/frog_chorus_synchrony/scripts/run_frogid_within_cell_robustness.py"
      - ".github/workflows/frog_chorus_spatial_confounding.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frog-chorus-spatial-confounding
  cancel-in-progress: true

jobs:
  naamp:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - run: python incubator/frog_chorus_synchrony/scripts/run_naamp_within_route_robustness.py
      - uses: actions/upload-artifact@v4
        with:
          name: frog-naamp-within-route-robustness-v0-1
          path: frog_naamp_within_route_robustness_v0_1.json
          if-no-files-found: error

  frogid:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -q icechunk xarray zarr numpy pandas scipy statsmodels patsy timezonefinder 'numcodecs[pcodec]'
      - run: python incubator/frog_chorus_synchrony/scripts/run_frogid_within_cell_robustness.py
      - uses: actions/upload-artifact@v4
        with:
          name: frog-frogid-within-cell-robustness-v0-1
          path: frog_frogid_within_cell_robustness_v0_1.json
          if-no-files-found: error
