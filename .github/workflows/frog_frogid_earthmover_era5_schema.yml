name: frog FrogID Earthmover ERA5 schema audit

on:
  push:
    branches:
      - incubator/frog-chorus-synchrony-v1
    paths:
      - "incubator/frog_chorus_synchrony/FROGID_VALIDATION_MODEL_CONTRACT_V0_3.json"
      - "incubator/frog_chorus_synchrony/scripts/run_frogid_earthmover_era5_schema.py"
      - ".github/workflows/frog_frogid_earthmover_era5_schema.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frog-frogid-earthmover-era5-schema
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -q icechunk xarray zarr
      - name: Audit Earthmover ERA5 temporal schema
        run: python incubator/frog_chorus_synchrony/scripts/run_frogid_earthmover_era5_schema.py
      - uses: actions/upload-artifact@v4
        with:
          name: frog-frogid-earthmover-era5-schema-v0-1
          path: frog_frogid_earthmover_era5_schema_v0_1.json
          if-no-files-found: error
