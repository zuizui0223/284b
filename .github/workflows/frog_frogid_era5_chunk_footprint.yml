name: frog FrogID ERA5 chunk footprint

on:
  push:
    branches:
      - incubator/frog-chorus-synchrony-v1
    paths:
      - "incubator/frog_chorus_synchrony/scripts/run_frogid_era5_chunk_footprint.py"
      - ".github/workflows/frog_frogid_era5_chunk_footprint.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frog-frogid-era5-chunk-footprint
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -q icechunk xarray zarr numpy
      - name: Audit frozen sample chunk footprint
        run: python incubator/frog_chorus_synchrony/scripts/run_frogid_era5_chunk_footprint.py
      - uses: actions/upload-artifact@v4
        with:
          name: frog-frogid-era5-chunk-footprint-v0-1
          path: frog_frogid_era5_chunk_footprint_v0_1.json
          if-no-files-found: error
