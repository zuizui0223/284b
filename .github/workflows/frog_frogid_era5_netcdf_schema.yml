name: frog FrogID ERA5 NetCDF schema audit

on:
  push:
    branches:
      - incubator/frog-chorus-synchrony-v1
    paths:
      - "incubator/frog_chorus_synchrony/scripts/run_frogid_era5_netcdf_schema.py"
      - ".github/workflows/frog_frogid_era5_netcdf_schema.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frog-frogid-era5-netcdf-schema
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -q s3fs xarray h5netcdf h5py
      - name: Audit remote ERA5 NetCDF schema
        run: python incubator/frog_chorus_synchrony/scripts/run_frogid_era5_netcdf_schema.py
      - uses: actions/upload-artifact@v4
        with:
          name: frog-frogid-era5-netcdf-schema-v0-1
          path: frog_frogid_era5_s3_netcdf_schema_v0_1.json
          if-no-files-found: error
