name: frog FrogID ERA5 S3 schema audit

on:
  push:
    branches:
      - incubator/frog-chorus-synchrony-v1
    paths:
      - "incubator/frog_chorus_synchrony/FROGID_VALIDATION_MODEL_CONTRACT_V0_2.json"
      - "incubator/frog_chorus_synchrony/scripts/run_frogid_era5_s3_schema.py"
      - ".github/workflows/frog_frogid_era5_s3_schema.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frog-frogid-era5-s3-schema
  cancel-in-progress: true

jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install S3 client
        run: python -m pip install --disable-pip-version-check -q boto3
      - name: Audit public ERA5 S3 schema
        run: python incubator/frog_chorus_synchrony/scripts/run_frogid_era5_s3_schema.py
      - name: Upload schema receipt
        uses: actions/upload-artifact@v4
        with:
          name: frog-frogid-era5-s3-schema-v0-1
          path: frog_frogid_era5_s3_schema_v0_1.json
          if-no-files-found: error
