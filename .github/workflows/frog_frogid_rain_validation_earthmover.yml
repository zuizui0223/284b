name: frog FrogID rain external validation Earthmover

on:
  push:
    branches:
      - incubator/frog-chorus-synchrony-v1
    paths:
      - "incubator/frog_chorus_synchrony/scripts/run_frogid_rain_validation_earthmover.py"
      - ".github/workflows/frog_frogid_rain_validation_earthmover.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frog-frogid-rain-validation-earthmover
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -q icechunk xarray zarr numpy pandas scipy statsmodels patsy timezonefinder 'numcodecs[pcodec]'
      - name: Run frozen independent FrogID validation
        run: python incubator/frog_chorus_synchrony/scripts/run_frogid_rain_validation_earthmover.py
      - name: Upload validation receipt
        uses: actions/upload-artifact@v4
        with:
          name: frog-frogid-rain-validation-earthmover-v0-2
          path: frog_frogid_rain_validation_earthmover_v0_2.json
          if-no-files-found: error
