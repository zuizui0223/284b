name: frog FrogID source identity audit

on:
  push:
    branches:
      - incubator/frog-chorus-synchrony-v1
    paths:
      - "incubator/frog_chorus_synchrony/FROGID_SOURCE_IDENTITY_V0_1.json"
      - "incubator/frog_chorus_synchrony/scripts/run_frogid_source_identity.py"
      - ".github/workflows/frog_frogid_source_identity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python incubator/frog_chorus_synchrony/scripts/run_frogid_source_identity.py
      - uses: actions/upload-artifact@v4
        with:
          name: frog-frogid-source-identity-v0-1
          path: frog_frogid_source_identity_v0_1.json
          if-no-files-found: error
