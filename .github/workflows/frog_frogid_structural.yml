name: frog FrogID v6 synchrony structural audit

on:
  push:
    branches:
      - incubator/frog-chorus-synchrony-v1
    paths:
      - "incubator/frog_chorus_synchrony/FROGID_VALIDATION_V0_2.json"
      - "incubator/frog_chorus_synchrony/scripts/run_frogid_structural_audit.py"
      - ".github/workflows/frog_frogid_structural.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python incubator/frog_chorus_synchrony/scripts/run_frogid_structural_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: frog-frogid-v6-synchrony-structural-v0-2
          path: frog_frogid_v6_synchrony_structural_v0_2.json
          if-no-files-found: error
