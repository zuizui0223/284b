name: frog FrogID verbatim field recovery

on:
  push:
    branches:
      - incubator/frog-chorus-synchrony-v1
    paths:
      - "incubator/frog_chorus_synchrony/FROGID_VALIDATION_V0_2_1.json"
      - "incubator/frog_chorus_synchrony/scripts/run_frogid_verbatim_field_recovery.py"
      - ".github/workflows/frog_frogid_verbatim_recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python incubator/frog_chorus_synchrony/scripts/run_frogid_verbatim_field_recovery.py
      - uses: actions/upload-artifact@v4
        with:
          name: frog-frogid-verbatim-field-recovery-v0-2-1
          path: frog_frogid_verbatim_field_recovery_v0_2_1.json
          if-no-files-found: error
