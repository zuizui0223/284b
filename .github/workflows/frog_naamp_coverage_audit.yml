name: frog NAAMP callindex weather coverage

on:
  push:
    branches:
      - incubator/frog-chorus-synchrony-v1
    paths:
      - "incubator/frog_chorus_synchrony/protocol_v0_2.json"
      - "incubator/frog_chorus_synchrony/scripts/run_naamp_coverage_audit.py"
      - ".github/workflows/frog_naamp_coverage_audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frog-naamp-coverage-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run outcome-blind coverage audit
        run: python incubator/frog_chorus_synchrony/scripts/run_naamp_coverage_audit.py
      - name: Upload sanitized receipt
        uses: actions/upload-artifact@v4
        with:
          name: frog-naamp-callindex-weather-coverage-v0-2
          path: frog_naamp_callindex_weather_coverage_v0_2.json
          if-no-files-found: error
