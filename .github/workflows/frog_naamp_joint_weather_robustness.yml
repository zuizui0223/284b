name: frog NAAMP joint weather robustness
on:
  push:
    branches: [incubator/frog-chorus-synchrony-v1]
    paths:
      - "incubator/frog_chorus_synchrony/NAAMP_JOINT_WEATHER_ROBUSTNESS_CONTRACT_V0_1.json"
      - "incubator/frog_chorus_synchrony/scripts/run_naamp_joint_weather_robustness.py"
      - ".github/workflows/frog_naamp_joint_weather_robustness.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  robust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - run: python incubator/frog_chorus_synchrony/scripts/run_naamp_joint_weather_robustness.py
      - uses: actions/upload-artifact@v4
        with:
          name: frog-naamp-joint-weather-robustness-v0-1
          path: frog_naamp_joint_weather_robustness_v0_1.json
          if-no-files-found: error
