name: frog NAAMP activation-overlap decomposition
on:
  push:
    branches: [incubator/frog-chorus-synchrony-v1]
    paths:
      - "incubator/frog_chorus_synchrony/NAAMP_MECHANISM_DECOMPOSITION_CONTRACT_V0_1.json"
      - "incubator/frog_chorus_synchrony/scripts/run_naamp_mechanism_decomposition.py"
      - ".github/workflows/frog_naamp_mechanism_decomposition.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mechanism:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - run: python incubator/frog_chorus_synchrony/scripts/run_naamp_mechanism_decomposition.py
      - uses: actions/upload-artifact@v4
        with:
          name: frog-naamp-activation-overlap-decomposition-v0-1
          path: frog_naamp_activation_overlap_decomposition_v0_1.json
          if-no-files-found: error
