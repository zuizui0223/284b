name: frog NAAMP chorus synchrony secondary

on:
  push:
    branches:
      - incubator/frog-chorus-synchrony-v1
    paths:
      - "incubator/frog_chorus_synchrony/NAAMP_SECONDARY_CONTRACT_V0_1.*"
      - "incubator/frog_chorus_synchrony/scripts/run_naamp_secondary.py"
      - ".github/workflows/frog_naamp_secondary.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frog-naamp-chorus-synchrony-secondary
  cancel-in-progress: true

jobs:
  secondary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - name: Run frozen secondary analyses
        run: python incubator/frog_chorus_synchrony/scripts/run_naamp_secondary.py
      - name: Upload secondary receipt
        uses: actions/upload-artifact@v4
        with:
          name: frog-naamp-chorus-synchrony-secondary-v0-1
          path: frog_naamp_chorus_synchrony_secondary_v0_1.json
          if-no-files-found: error
