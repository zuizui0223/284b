name: frog NAAMP secondary semantics audit

on:
  push:
    branches:
      - incubator/frog-chorus-synchrony-v1
    paths:
      - "incubator/frog_chorus_synchrony/scripts/run_naamp_secondary_semantics.py"
      - ".github/workflows/frog_naamp_secondary_semantics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python incubator/frog_chorus_synchrony/scripts/run_naamp_secondary_semantics.py
      - uses: actions/upload-artifact@v4
        with:
          name: frog-naamp-secondary-semantics-v0-1
          path: frog_naamp_temperature_run_semantics_v0_1.json
          if-no-files-found: error
