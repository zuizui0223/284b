name: frog NAAMP temperature QC

on:
  push:
    branches:
      - incubator/frog-chorus-synchrony-v1
    paths:
      - "incubator/frog_chorus_synchrony/NAAMP_TEMP_QC_CONTRACT_V0_1.json"
      - "incubator/frog_chorus_synchrony/scripts/run_naamp_temp_qc.py"
      - ".github/workflows/frog_naamp_temp_qc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - run: python incubator/frog_chorus_synchrony/scripts/run_naamp_temp_qc.py
      - uses: actions/upload-artifact@v4
        with:
          name: frog-naamp-temperature-qc-v0-1
          path: frog_naamp_temperature_qc_v0_1.json
          if-no-files-found: error
