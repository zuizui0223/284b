name: frog RMNP eligibility gate

on:
  push:
    branches:
      - incubator/frog-demographic-decoupling-v1
    paths:
      - "incubator/frog_demographic_decoupling/RMNP_ELIGIBILITY_GATE_V0_1.*"
      - "incubator/frog_demographic_decoupling/scripts/run_rmnp_eligibility_audit.py"
      - "tests/test_rmnp_frog_eligibility.py"
      - ".github/workflows/frog_rmnp_eligibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test frozen eligibility rules
        run: python -m unittest tests/test_rmnp_frog_eligibility.py -v
      - name: Run RMNP eligibility audit
        run: python incubator/frog_demographic_decoupling/scripts/run_rmnp_eligibility_audit.py
      - name: Upload eligibility receipt
        uses: actions/upload-artifact@v4
        with:
          name: frog-rmnp-psma-eligibility-v0-1
          path: frog_rmnp_psma_eligibility_v0_1.json
          if-no-files-found: error
