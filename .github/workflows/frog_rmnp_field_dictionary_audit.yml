name: frog RMNP field dictionary audit

on:
  push:
    branches:
      - incubator/frog-demographic-decoupling-v1
    paths:
      - "incubator/frog_demographic_decoupling/protocol_v0_10_3.json"
      - "incubator/frog_demographic_decoupling/scripts/run_rmnp_field_dictionary_audit.py"
      - ".github/workflows/frog_rmnp_field_dictionary_audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dictionary-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read publisher field definitions only
        run: python incubator/frog_demographic_decoupling/scripts/run_rmnp_field_dictionary_audit.py
      - name: Upload sanitized field dictionary
        uses: actions/upload-artifact@v4
        with:
          name: frog-rmnp-field-dictionary-v0-1
          path: frog_rmnp_field_dictionary_v0_1.json
          if-no-files-found: error
