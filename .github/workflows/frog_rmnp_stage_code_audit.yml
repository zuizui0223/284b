name: frog RMNP stage-code schema audit

on:
  push:
    branches:
      - incubator/frog-demographic-decoupling-v1
    paths:
      - "incubator/frog_demographic_decoupling/protocol_v0_10_1.json"
      - "incubator/frog_demographic_decoupling/scripts/run_rmnp_stage_code_audit.py"
      - ".github/workflows/frog_rmnp_stage_code_audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frog-rmnp-stage-code-schema-audit
  cancel-in-progress: true

jobs:
  schema-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run publisher stage-code audit
        run: python incubator/frog_demographic_decoupling/scripts/run_rmnp_stage_code_audit.py
      - name: Upload sanitized stage-code receipt
        uses: actions/upload-artifact@v4
        with:
          name: frog-rmnp-stage-code-schema-v0-1
          path: frog_rmnp_stage_code_schema_v0_1.json
          if-no-files-found: error
