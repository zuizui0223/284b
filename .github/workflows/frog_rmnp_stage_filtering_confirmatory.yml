name: frog RMNP confirmatory stage filtering

on:
  push:
    branches:
      - incubator/frog-demographic-decoupling-v1
    paths:
      - "incubator/frog_demographic_decoupling/RMNP_MODEL_REPAIR_V0_12_1.json"
      - "incubator/frog_demographic_decoupling/scripts/run_rmnp_stage_filtering_confirmatory.py"
      - ".github/workflows/frog_rmnp_stage_filtering_confirmatory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirmatory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check pandas statsmodels
      - name: Run frozen confirmatory models
        run: python incubator/frog_demographic_decoupling/scripts/run_rmnp_stage_filtering_confirmatory.py
      - name: Upload confirmatory receipt
        uses: actions/upload-artifact@v4
        with:
          name: frog-rmnp-stage-filtering-confirmatory-v0-1
          path: frog_rmnp_stage_filtering_confirmatory_v0_1.json
          if-no-files-found: error
