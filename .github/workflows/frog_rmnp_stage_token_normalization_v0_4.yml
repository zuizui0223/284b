name: frog RMNP stage-token normalization

on:
  push:
    branches:
      - incubator/frog-demographic-decoupling-v1
    paths:
      - "incubator/frog_demographic_decoupling/protocol_v0_10_4.json"
      - "incubator/frog_demographic_decoupling/scripts/run_rmnp_stage_token_normalization_v0_4.py"
      - ".github/workflows/frog_rmnp_stage_token_normalization_v0_4.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frog-rmnp-stage-token-normalization-v0-4
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Normalize documented stage tokens
        run: python incubator/frog_demographic_decoupling/scripts/run_rmnp_stage_token_normalization_v0_4.py
      - name: Upload structural token receipt
        uses: actions/upload-artifact@v4
        with:
          name: frog-rmnp-stage-token-normalization-v0-4
          path: frog_rmnp_stage_token_normalization_v0_1.json
          if-no-files-found: error
