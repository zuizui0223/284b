name: frog Sunshine Coast call-code metadata audit

on:
  push:
    branches:
      - incubator/frog-chorus-synchrony-v1
    paths:
      - "incubator/frog_chorus_synchrony/scripts/run_sunshine_call_code_metadata_audit.py"
      - ".github/workflows/frog_sunshine_call_code_metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python incubator/frog_chorus_synchrony/scripts/run_sunshine_call_code_metadata_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: frog-sunshine-call-code-metadata-v0-1
          path: frog_sunshine_call_code_metadata_v0_1.json
          if-no-files-found: error
