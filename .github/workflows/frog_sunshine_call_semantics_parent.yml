name: frog Sunshine call semantics and parent geometry

on:
  push:
    branches:
      - incubator/frog-chorus-synchrony-v1
    paths:
      - "incubator/frog_chorus_synchrony/EXTERNAL_VALIDATION_V0_1_2.json"
      - "incubator/frog_chorus_synchrony/scripts/run_sunshine_call_semantics_parent.py"
      - ".github/workflows/frog_sunshine_call_semantics_parent.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python incubator/frog_chorus_synchrony/scripts/run_sunshine_call_semantics_parent.py
      - uses: actions/upload-artifact@v4
        with:
          name: frog-sunshine-call-semantics-parent-v0-1-2
          path: frog_sunshine_call_semantics_parent_geometry_v0_1_2.json
          if-no-files-found: error
