name: frog Sunshine Coast DwC-A mapping repair

on:
  push:
    branches:
      - incubator/frog-chorus-synchrony-v1
    paths:
      - "incubator/frog_chorus_synchrony/EXTERNAL_VALIDATION_V0_1_1.json"
      - "incubator/frog_chorus_synchrony/scripts/run_sunshine_dwca_mapping_repair.py"
      - ".github/workflows/frog_sunshine_dwca_mapping_repair.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python incubator/frog_chorus_synchrony/scripts/run_sunshine_dwca_mapping_repair.py
      - uses: actions/upload-artifact@v4
        with:
          name: frog-sunshine-dwca-mapping-repair-v0-1-1
          path: frog_sunshine_dwca_mapping_repair_v0_1_1.json
          if-no-files-found: error
