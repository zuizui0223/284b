name: Frozen 9705-file GBIF source lineage replay (Artemisia pilot)
on:
  push:
    branches: [analysis/neon-external-truth-preflight-20261115]
    paths:
      - 'scripts/audit_original_gbif_neon_historical_replay_v2.py'
      - 'tests/test_gbif_historical_replay_paths_v2.py'
      - '.github/workflows/gbif_historical_source_lineage_replay_v2.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: frozen-gbif-9705-source-lineage-${{ github.ref }}
  cancel-in-progress: false
jobs:
  historical-9705-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test exact original 9705 file-set selection and no backfill
        run: python -m unittest discover -s tests -p 'test_gbif_historical_replay_paths_v2.py' -v
      - name: Verify signed original model-input denominators before reading source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10089523542/zip" > /tmp/original_heldout_model0.zip
          python - <<'PY'
          import csv,hashlib,io,json,pathlib,zipfile
          cfg=json.loads(pathlib.Path('config/original_gbif_neon_datasetkey_pilot_v1.json').read_text())
          data=pathlib.Path('/tmp/original_heldout_model0.zip').read_bytes()
          assert 'sha256:'+hashlib.sha256(data).hexdigest()==cfg['pilot']['original_signed_core19_model_artifact_digest']
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              tab=list(csv.DictReader(z.read('fit_inventory.csv').decode().splitlines()))
              assert len(tab)==48
              for mode,n in cfg['pilot']['expected_thinned_model_presence_counts'].items():
                  nums={int(x['n_presence_thinned']) for x in tab if x['source']==mode}
                  assert nums=={n},(mode,nums,n)
          print('signed historical model source denominators verified')
          PY
      - name: Install exact original model's upstream source parser dependencies
        run: |
          git clone --quiet https://github.com/zuizui0223/sdmr.git sdmr
          git -C sdmr checkout --quiet 9d2a45b56408cde8a4af41722538d0086c532cc9
          python -m pip install --disable-pip-version-check -q -e './sdmr[cloud,parquet,geo]'
      - name: Reconstruct only frozen 9705 GBIF parquet objects and audit NEON datasetKey provenance
        run: |
          python scripts/audit_original_gbif_neon_historical_replay_v2.py \
            --out results/neon_original_gbif_historical_replay_v2.json
      - name: Preserve aggregate receipt also on scientific stop
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gbif-aug9705-Artemisia-original-source-v2
          path: results/neon_original_gbif_historical_replay_v2.json
          if-no-files-found: warn
      - name: Commit only aggregate provenance counts, never identifiers
        if: always()
        run: |
          if [ ! -f results/neon_original_gbif_historical_replay_v2.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/neon_original_gbif_historical_replay_v2.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Archive known NEON datasetKey counts on exact frozen 9705-file GBIF source"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
