name: "Replay frozen heldout12 original geometry via Artemisia portable pilot"
on:
  push:
    branches: [analysis/neon-external-truth-preflight-20261115]
    paths:
      - 'scripts/reconstruct_original_heldout12_centers_v1.py'
      - 'tests/test_gbif_original_heldout12_geometry_v1.py'
      - '.github/workflows/gbif_original_heldout12_geometry_portability_v1.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: gbif-original-heldout12-geometry-portability-pilot
  cancel-in-progress: false
jobs:
  heldout0-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify signed heldout12 population and original specieskeys
        run: |
          python -m unittest discover -s tests -p 'test_gbif_original_heldout12_geometry_v1.py' -v
          python -m py_compile scripts/reconstruct_original_heldout12_centers_v1.py
      - name: Install original 2026-08 historical source processing
        run: |
          git clone --quiet https://github.com/zuizui0223/sdmr.git sdmr
          git -C sdmr checkout --quiet 9d2a45b56408cde8a4af41722538d0086c532cc9
          python -m pip install --disable-pip-version-check -q -e './sdmr[cloud,parquet,geo]'
      - name: Fetch exact original frozen Artemisia qualification and fit ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          m=json.loads(pathlib.Path('config/gbif_original_heldout12_geometry_manifest_v1.json').read_text())
          e=m['entries'][0]
          assert e['index']==0 and e['taxon']=='Artemisia tridentata' and e['historical_specieskey']=='GX2B'
          for idkey,hashkey,path in (
              ('original_qualification_artifact_id','original_qualification_artifact_digest','/tmp/heldout_original_frame.zip'),
              ('original_fit_artifact_id','original_fit_artifact_digest','/tmp/heldout_original_fit.zip'),
          ):
              with open(path,'wb') as f:
                  subprocess.run(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{e[idkey]}/zip"],stdout=f,check=True)
              actual='sha256:'+hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
              if actual!=e[hashkey]:
                  raise RuntimeError(f'Original heldout artifact SHA mismatch: {idkey}')
          print('original heldout source frame and model signed ZIP verified')
          PY
      - name: Reconstruct original heldout Artemisia centers with generalized 12-taxon code
        run: |
          python scripts/reconstruct_original_heldout12_centers_v1.py \
            --taxon-index 0 \
            --frame-zip /tmp/heldout_original_frame.zip \
            --fit-zip /tmp/heldout_original_fit.zip \
            --out-centers out/heldout_original_centers.npy \
            --out-json out/heldout_geometry_ref_0.json
      - name: Require exact match with independently signed previous Artemisia center replay
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          x=json.loads(pathlib.Path('out/heldout_geometry_ref_0.json').read_text())
          old=json.loads(pathlib.Path('results/gbif_original_centers_Artemisia_v1.json').read_text())
          assert x['status']=='ORIGINAL_SIGNED_HELDOUT_GEOMETRY_EXACTLY_REPRODUCED'
          assert x['taxon']=='Artemisia tridentata' and x['taxon_index']==0 and x['historical_specieskey']=='GX2B'
          assert x['reconstructed_center_sha256']==x['original_center_sha256']==old['recomputed_centers_SHA256']
          assert x['original_pooled_geometry_cells']==old['original_source_blind_geometry_cells']==6932
          assert x['original_comparison_frame_sha256_by_M']==old['original_frozen_comparison_frame_SHA256_by_M']
          assert x['original_source_thinned_counts']==old['original_historical_source_thinned_counts']
          assert x['center_npy_sha256']==old['centers_np_array_SHA256']
          assert x['source_rows_or_coordinates_exported'] is False
          assert x['repaired_model_fit_performed'] is False and x['reference_q95_opened'] is False
          assert x['empirical_ledger_increment']==0
          print('portable 12-taxon historical geometry algorithm matches previously signed Artemisia')
          PY
      - name: Preserve signed pilot array and receipt, not ecological outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gbif-original-heldout12-geometry-portable-index0
          path: out/
          retention-days: 45
          if-no-files-found: warn
      - name: Archive source-only geometry pilot provenance
        if: success()
        run: |
          mkdir -p results
          cp out/heldout_geometry_ref_0.json results/gbif_original_heldout12_geometry_pilot_index0_v1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/gbif_original_heldout12_geometry_pilot_index0_v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Archive original heldout12 Artemisia geometry portability verification"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
