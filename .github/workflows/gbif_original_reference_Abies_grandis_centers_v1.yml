name: "Reproduce reference Abies grandis original 12-block centers"
on:
  push:
    branches: [analysis/neon-external-truth-preflight-20261115]
    paths:
      - 'config/gbif_original_reference_centers_Abies_grandis_v1.json'
      - 'scripts/reconstruct_original_reference_Abies_grandis_centers_v1.py'
      - 'tests/test_gbif_original_reference_Abies_grandis_centers_v1.py'
      - '.github/workflows/gbif_original_reference_Abies_grandis_centers_v1.yml'
permissions:
  actions: read
  contents: write
concurrency:
  group: gbif-9705-original-reference-Abies-grandis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reference-two-key-original-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate original 47-reference sample identity without reading predictions
        run: |
          python -m unittest discover -s tests -p 'test_gbif_original_reference_Abies_grandis_centers_v1.py' -v
          python -m py_compile scripts/reconstruct_original_reference_Abies_grandis_centers_v1.py
      - name: Install original historical source-parsing and geometry packages
        run: |
          git clone --quiet https://github.com/zuizui0223/sdmr.git sdmr
          git -C sdmr checkout --quiet 9d2a45b56408cde8a4af41722538d0086c532cc9
          python -m pip install --disable-pip-version-check -q -e './sdmr[cloud,parquet,geo]'
      - name: Retrieve SHA-verified original reference preflight artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10066646765/zip" > /tmp/original_reference_Abies_grandis_frame.zip
          python - <<'PY'
          import hashlib,json,pathlib,zipfile
          cfg=json.loads(pathlib.Path('config/gbif_original_reference_centers_Abies_grandis_v1.json').read_text())
          raw=pathlib.Path('/tmp/original_reference_Abies_grandis_frame.zip').read_bytes()
          assert "sha256:"+hashlib.sha256(raw).hexdigest()==cfg['original_signed_qualification_digest']
          with zipfile.ZipFile('/tmp/original_reference_Abies_grandis_frame.zip') as z:
              old=json.loads(z.read('receipt.json'))
              assert old['taxon']==cfg['original_taxon'] and old['taxon_index']==cfg['original_index']
              assert old['historical_specieskeys']==cfg['original_historical_specieskeys']
              assert old['common_block_centers_sha256']==cfg['original_12block_centers_sha256']
              assert old['source_blind_common_geometry_cells']==cfg['original_common_pooled_cells']
          print('signed 7244 original pooled-cell reference preflight verified')
          PY
      - name: Reconstruct both historical specieskeys, source-thinning and original 12 centers
        run: |
          python scripts/reconstruct_original_reference_Abies_grandis_centers_v1.py \
            --frame-zip /tmp/original_reference_Abies_grandis_frame.zip \
            --out-centers results/reference_geometry/Abies_grandis_centers.npy \
            --out-json results/gbif_original_reference_Abies_grandis_centers_v1.json
      - name: Archive reference center array and signed receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Abies-grandis-original-reference-centers-v1
          path: |
            results/reference_geometry/Abies_grandis_centers.npy
            results/gbif_original_reference_Abies_grandis_centers_v1.json
          if-no-files-found: warn
          retention-days: 45
      - name: Preserve only metadata attestation in repo
        if: always()
        run: |
          if [ ! -f results/gbif_original_reference_Abies_grandis_centers_v1.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/gbif_original_reference_Abies_grandis_centers_v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Archive exact frozen dual-key Abies reference geometry SHA"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
