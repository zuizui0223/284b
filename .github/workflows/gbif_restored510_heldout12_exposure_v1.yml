name: "GBIF restored-510 heldout12 source exposure"
on:
  push:
    branches: [analysis/neon-external-truth-preflight-20261115]
    paths:
      - 'scripts/audit_gbif_restored510_focal_taxa_v1.py'
      - 'tests/test_gbif_restored510_focal_taxa_v1.py'
      - '.github/workflows/gbif_restored510_heldout12_exposure_v1.yml'
permissions:
  contents: write
concurrency:
  group: gbif-restored510-heldout12-${{ github.ref }}
  cancel-in-progress: false
jobs:
  missing20-exposure:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate no-label aggregate source count guard
        run: python -m unittest discover -s tests -p 'test_gbif_restored510_focal_taxa_v1.py' -v
      - name: Install unsigned S3 parquet reader
        run: python -m pip install --disable-pip-version-check -q pyarrow
      - name: Scan exclusively the 510 October-restored files for 12 frozen species keys
        run: |
          python scripts/audit_gbif_restored510_focal_taxa_v1.py \
            --out results/gbif_restored510_heldout12_exposure_v1.json
      - name: Preserve aggregate report even if audit stops
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gbif-missing20-repaired510-heldout12
          path: results/gbif_restored510_heldout12_exposure_v1.json
          if-no-files-found: warn
      - name: Archive aggregates without row-level public identifiers
        if: always()
        run: |
          if [ ! -f results/gbif_restored510_heldout12_exposure_v1.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/gbif_restored510_heldout12_exposure_v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record restored-file raw record exposure across frozen 12 taxa"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
