name: "GBIF missing20 original-vs-restored raw source imbalance v1"
on:
  push:
    branches: [analysis/neon-external-truth-preflight-20261115]
    paths:
      - 'scripts/summarize_gbif_restored510_source_imbalance_v1.py'
      - 'tests/test_gbif_restored510_source_imbalance_v1.py'
      - '.github/workflows/gbif_restored510_source_imbalance_v1.yml'
permissions:
  contents: write
concurrency:
  group: gbif-restored510-source-imbalance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  descriptive-source-imbalance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Test original and restored raw source-mode accountings
        run: python -m unittest discover -s tests -p 'test_gbif_restored510_source_imbalance_v1.py' -v
      - name: Produce immutable, machine-readable descriptive source restorations
        run: |
          python scripts/summarize_gbif_restored510_source_imbalance_v1.py \
            --out results/gbif_restored510_source_imbalance_v1.json
      - name: Archive descriptive aggregate only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/gbif_restored510_source_imbalance_v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Archive observed raw GBIF missing20 source-mode asymmetry"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
