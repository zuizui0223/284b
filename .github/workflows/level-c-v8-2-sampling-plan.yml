name: level-c-v8-2-sampling-plan

on:
  pull_request:
    paths:
      - 'config/product_b_level_c_sampling_plan_v8_2.json'
      - 'scripts/audit_level_c_sampling_plan_v8_2.py'
      - 'tests/test_level_c_sampling_plan_v8_2.py'
      - 'docs/product_b_level_c_sampling_plan_v8_2.md'
      - '.github/workflows/level-c-v8-2-sampling-plan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_level_c_sampling_plan_v8_2.py' -v
      - name: Write outcome-blind exact sampling-plan audit receipt
        run: >-
          python scripts/audit_level_c_sampling_plan_v8_2.py
          config/product_b_level_c_sampling_plan_v8_2.json
          --out v8_2_sampling_plan_audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: level-c-v8-2-sampling-plan-audit-${{ github.sha }}
          path: v8_2_sampling_plan_audit.json
          retention-days: 90
