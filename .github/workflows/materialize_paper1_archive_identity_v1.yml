name: materialize-paper1-archive-identity-v1

on:
  push:
    branches:
      - paper/archive-freeze-v1

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paper/archive-freeze-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build receipt
        run: python scripts/build_paper1_archive_identity_v1.py
      - name: Persist receipt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manuscript/PAPER1_ARCHIVE_IDENTITY_V1.json manuscript/PAPER1_ARCHIVE_IDENTITY_V1.md
          git commit -m 'Materialize commit-independent Paper 1 archive identity'
          git push origin HEAD:paper/archive-freeze-v1
