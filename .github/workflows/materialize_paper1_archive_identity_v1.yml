name: materialize-paper1-archive-identity-v1

on:
  push:
    branches:
      - paper/archive-freeze-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paper/archive-freeze-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build content-addressed archive receipt
        run: python scripts/build_paper1_archive_identity_v1.py
      - name: Verify receipt boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('manuscript/PAPER1_ARCHIVE_IDENTITY_V1.json').read_text())
          assert p['scientific_source_sha256']=='66ad208f2a922800cb7f1d14f96b28295de13af4cdbdbec2f8b698b8fa320cc5'
          assert p['submission_derivative_sha256']=='a2f45e2b91953b47f24682e95667533a923680ec65a9b0fef2c88a423b75cf84'
          assert p['scientific_boundary']['empirical_ledger']==1
          assert p['scientific_boundary']['level_b']=='unopened'
          assert p['scientific_boundary']['level_c']=='focal_outcomes_sealed'
          assert p['doi'] is None and p['release_tag'] is None
          assert len(p['files'])==25
          assert any(x['path']=='scripts/build_paper1_archive_identity_v1.py' for x in p['files'])
          assert len(p['bundle_identity_sha256'])==64
          PY
      - name: Persist archive receipt on branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manuscript/PAPER1_ARCHIVE_IDENTITY_V1.json manuscript/PAPER1_ARCHIVE_IDENTITY_V1.md
          if git diff --cached --quiet; then
            echo 'Archive identity already materialized.'
          else
            git commit -m 'Materialize Paper 1 archive identity v1'
            git push origin HEAD:paper/archive-freeze-v1
          fi
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: paper1-archive-identity-v1
          path: |
            manuscript/PAPER1_ARCHIVE_IDENTITY_V1.json
            manuscript/PAPER1_ARCHIVE_IDENTITY_V1.md
          if-no-files-found: error
          retention-days: 7
