name: verify-paper1-v010-materialization

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve committed exact manuscript
        run: cp manuscript/PREFIELD_FLAGSHIP_V0_10_CANDIDATE.md /tmp/PREFIELD_FLAGSHIP_V0_10_COMMITTED.md
      - name: Rebuild v0.10 deterministically
        run: python scripts/build_prefield_flagship_v0_10_candidate.py
      - name: Require byte identity with committed manuscript
        run: cmp /tmp/PREFIELD_FLAGSHIP_V0_10_COMMITTED.md manuscript/PREFIELD_FLAGSHIP_V0_10_CANDIDATE.md
      - name: Verify committed SHA-256 identity
        run: sha256sum -c manuscript/PREFIELD_FLAGSHIP_V0_10_CANDIDATE.sha256
      - name: Run v0.10 manuscript and final-submission guards
        run: >-
          python scripts/run_paper1_function_guards.py
          tests/test_paper1_v10_compression.py
          tests/test_paper1_v10_final_submission.py
      - name: Upload verified manuscript
        uses: actions/upload-artifact@v4
        with:
          name: paper1-v010-verified
          path: |
            manuscript/PREFIELD_FLAGSHIP_V0_10_CANDIDATE.md
            manuscript/PREFIELD_FLAGSHIP_V0_10_CANDIDATE.sha256
            manuscript/PREFIELD_FLAGSHIP_V0_10_IDENTITY.txt
          if-no-files-found: error
          retention-days: 7
