name: NEON field-plot source metadata preflight
on:
  push:
    branches:
      - analysis/neon-external-truth-preflight-20261115
    paths:
      - 'config/neon_external_validation_preflight_v1.json'
      - 'scripts/neon_external_metadata_preflight_v1.py'
      - 'tests/test_neon_external_metadata_preflight_v1.py'
      - '.github/workflows/neon_external_metadata_preflight_v1.yml'

permissions:
  contents: write

concurrency:
  group: neon-metadata-${{ github.ref }}
  cancel-in-progress: false

jobs:
  product-metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen product and source-only access contract
        run: python -m unittest discover -s tests -p 'test_neon_external_metadata_preflight_v1.py' -v
      - name: Read metadata only from NEON public product API
        run: |
          python scripts/neon_external_metadata_preflight_v1.py \
            --out results/neon_external_metadata_preflight_v1.json
      - name: Preserve exact metadata receipt; never acquire species records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/neon_external_metadata_preflight_v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Archive NEON released product metadata feasibility only"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
