name: NEON sites versus frozen Level-A frame geography
on:
  push:
    branches: [analysis/neon-external-truth-preflight-20261115]
    paths:
      - 'config/neon_original_frame_site_distance_proxy_v1.json'
      - 'scripts/audit_neon_frame_site_proximity_v1.py'
      - 'integration_tests/test_neon_frame_site_proximity_v1.py'
      - '.github/workflows/neon_frame_site_proximity_v1.yml'
permissions:
  actions: read
  contents: write
concurrency:
  group: neon-frame-site-proxy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frame-geographic-support:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install signed frame dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas pyarrow
      - name: Verify geographic distance library
        run: python -m unittest discover -s integration_tests -p 'test_neon_frame_site_proximity_v1.py' -v
      - name: Retrieve only 7 originally signed core19 background frames
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/original_frames
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          cfg=json.loads(pathlib.Path('config/neon_original_frame_site_distance_proxy_v1.json').read_text())
          assert len(cfg['historical_frozen_taxa'])==7
          root=pathlib.Path('build/original_frames')
          for item in cfg['historical_frozen_taxa']:
              path=root/f"frame_{item['original_index']}.zip"
              with path.open('wb') as f:
                  subprocess.run(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{item['frame_artifact_id']}/zip"],stdout=f,check=True)
              actual=hashlib.sha256(path.read_bytes()).hexdigest()
              assert "sha256:"+actual==item['frame_artifact_digest']
              print(item['taxon'],'signed frame verified')
          PY
      - name: Evaluate NEON site centroid distances without plant or plot outcomes
        run: |
          python scripts/audit_neon_frame_site_proximity_v1.py \
            --artifact-dir build/original_frames \
            --out-json results/neon_frame_site_proximity_v1.json \
            --out-csv results/neon_frame_site_proximity_cells_v1.csv
      - name: Archive derived site-proximity diagnostics only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/neon_frame_site_proximity_v1.json results/neon_frame_site_proximity_cells_v1.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Archive NEON site proximity to signed source-blind Level-A frames"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
