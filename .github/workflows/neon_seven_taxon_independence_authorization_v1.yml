name: "NEON independent-field-claim authorization, seven frozen taxa"
on:
  push:
    branches: [analysis/neon-external-truth-preflight-20261115]
    paths:
      - 'scripts/authorize_neon_seven_taxon_source_independence_v1.py'
      - 'tests/test_neon_seven_taxon_independence_authorization_v1.py'
      - '.github/workflows/neon_seven_taxon_independence_authorization_v1.yml'
permissions:
  contents: write
concurrency:
  group: neon-seven-source-independence-gate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  seven-source-independence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify seven-taxon signed source lineage and stop-rule tests
        run: python -m unittest discover -s tests -p 'test_neon_seven_taxon_independence_authorization_v1.py' -v
      - name: Evaluate source-level NEON reuse without plot-label access
        run: |
          python scripts/authorize_neon_seven_taxon_source_independence_v1.py \
            --out results/neon_seven_taxon_independence_authorization_v1.json
      - name: Archive signed source gate, not field conclusions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/neon_seven_taxon_independence_authorization_v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Archive seven-taxon NEON source-independence STOP receipt"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
