name: NEON released site centroid geographic feasibility
on:
  push:
    branches: [analysis/neon-external-truth-preflight-20261115]
    paths:
      - 'config/neon_site_geography_preflight_v1.json'
      - 'scripts/neon_site_geometry_metadata_v1.py'
      - 'tests/test_neon_site_geometry_metadata_v1.py'
      - '.github/workflows/neon_site_geometry_metadata_v1.yml'
permissions:
  contents: write
concurrency:
  group: neon-site-geography-${{ github.ref }}
  cancel-in-progress: false
jobs:
  site-metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Synthetic tests for site geography and no-label gates
        run: python -m unittest discover -s tests -p 'test_neon_site_geometry_metadata_v1.py' -v
      - name: Read NEON sites API metadata only
        run: |
          python scripts/neon_site_geometry_metadata_v1.py \
            --out results/neon_site_geography_preflight_v1.json
      - name: Save released site centroids (no plot/species observations)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-release-site-geography-v1
          path: results/neon_site_geography_preflight_v1.json
          if-no-files-found: warn
      - name: Commit source metadata receipt only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/neon_site_geography_preflight_v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Archive metadata-only NEON site centroids and geographic range"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
