name: Niche demographic divergence common-pair audit
on:
  push:
    branches: [analysis/niche-demographic-divergence-20261127]
    paths: ['scripts/niche_demographic_divergence_common_pair_audit.py', '.github/workflows/niche-demographic-divergence-common-pair.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy requests rasterio
      - run: python scripts/niche_demographic_divergence_common_pair_audit.py --data build/fia-raw --out build/common-pair-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: niche-demographic-common-pair-audit
          path: build/common-pair-audit/
          if-no-files-found: warn
          retention-days: 30
