name: Niche demographic divergence FIA pilot
on:
  push:
    branches: [analysis/niche-demographic-divergence-20261127]
    paths: ['scripts/niche_demographic_divergence_fia_pilot.py', '.github/workflows/niche-demographic-divergence-pilot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy requests rasterio
      - run: |
          mkdir -p build/niche-divergence
          python scripts/niche_demographic_divergence_fia_pilot.py --data build/fia-raw --out build/niche-divergence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: niche-demographic-divergence-fia-pilot
          path: build/niche-divergence/
          if-no-files-found: warn
          retention-days: 30
