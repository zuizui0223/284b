name: paper1-figure-qa

on:
  push:
    branches:
      - paper/figure-final-qa
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering dependencies
        run: python -m pip install --disable-pip-version-check cairosvg pillow
      - name: Render at 173 mm and compute physical-size metrics
        run: python scripts/render_paper1_submission_figures.py
      - name: Upload visual-QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper1-figure-qa-173mm
          path: artifacts/paper1_figure_qa
          if-no-files-found: error
          retention-days: 7
