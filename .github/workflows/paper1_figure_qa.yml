name: paper1-figure-qa

on:
  push:
    branches:
      - paper/figure-final-qa
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paper/figure-final-qa
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering and PDF-inspection dependencies
        run: |
          python -m pip install --disable-pip-version-check cairosvg pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Render at 173 mm and compute physical-size metrics
        run: python scripts/render_paper1_submission_figures.py
      - name: Export 173 mm vector PDFs
        run: python scripts/export_paper1_submission_figures.py
      - name: Inspect PDF page sizes and embedded fonts
        run: |
          for f in artifacts/paper1_submission_figures/Figure_*.pdf; do
            echo "=== $f ==="
            pdfinfo "$f" | grep -E '^(Page size|File size|PDF version)'
            pdffonts "$f"
          done
      - name: Persist exact v1 SVGs on branch
        run: |
          if git diff --quiet -- manuscript/figures/*_v1_0.svg && \
             test "$(git ls-files 'manuscript/figures/*_v1_0.svg' | wc -l)" -eq 5; then
            echo 'Submission v1 SVGs already materialized.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add manuscript/figures/*_v1_0.svg
            git commit -m 'Materialize Paper 1 submission figures v1'
            git push origin HEAD:paper/figure-final-qa
          fi
      - name: Upload visual-QA and submission-PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper1-figure-qa-173mm
          path: |
            artifacts/paper1_figure_qa
            artifacts/paper1_submission_figures
          if-no-files-found: error
          retention-days: 7
