name: Recover GBIF 2026-08 historical object manifest from restored multiples-of-20 files
on:
  push:
    branches: [analysis/neon-external-truth-preflight-20261115]
    paths:
      - 'scripts/recover_gbif_aug_snapshot_missing20_v1.py'
      - 'tests/test_gbif_snapshot_missing20_recovery_v1.py'
      - '.github/workflows/recover_gbif_aug_snapshot_missing20_v1.yml'
permissions:
  contents: write
concurrency:
  group: gbif-aug-missing20-recovery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  old-object-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify modulo-20 recovery without biological record access
        run: python -m unittest discover -s tests -p 'test_gbif_snapshot_missing20_recovery_v1.py' -v
      - name: Rebuild original 9,705 object set's exact ETag and LastModified fingerprint
        run: |
          python scripts/recover_gbif_aug_snapshot_missing20_v1.py \
            --out results/neon_aug_gbif_missing20_recovery_v1.json
      - name: Preserve recovery receipt including failure state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gbif-aug-missing20-recovery
          path: results/neon_aug_gbif_missing20_recovery_v1.json
          if-no-files-found: warn
      - name: Commit metadata result only
        if: always()
        run: |
          if [ ! -f results/neon_aug_gbif_missing20_recovery_v1.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/neon_aug_gbif_missing20_recovery_v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record historical GBIF manifest recovery from missing20 metadata test"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
