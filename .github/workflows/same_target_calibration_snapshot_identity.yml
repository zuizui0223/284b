name: same-target-calibration-snapshot-identity

on:
  push:
    branches:
      - product-b-v5-obligate-invariant
    paths:
      - results/product_b_same_target_source_current_taxonomy_v0_1.json

permissions:
  contents: write

jobs:
  snapshot-identity-only:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product-b-v5-obligate-invariant
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run repository tests before snapshot taxonomy access
        run: python -m unittest discover -s tests -v
      - name: Install frozen snapshot scanner
        run: python -m pip install --disable-pip-version-check --quiet "pyarrow==21.0.0"
      - name: Resolve current-taxonomy-passed taxa inside frozen snapshot
        env:
          PYTHONPATH: .
        run: python scripts/run_same_target_calibration_snapshot_identity.py
      - name: Commit snapshot taxonomy-only audit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin product-b-v5-obligate-invariant
          git add results/product_b_same_target_source_snapshot_identity_v0_1.json
          if git diff --cached --quiet; then
            echo "No snapshot identity result change to commit"
          else
            git commit -m "Record calibration panel snapshot identity audit"
            git push origin HEAD:product-b-v5-obligate-invariant
          fi
      - name: Upload snapshot identity audit
        uses: actions/upload-artifact@v4
        with:
          name: product-b-same-target-snapshot-identity
          path: results/product_b_same_target_source_snapshot_identity_v0_1.json
          if-no-files-found: error
          retention-days: 90
