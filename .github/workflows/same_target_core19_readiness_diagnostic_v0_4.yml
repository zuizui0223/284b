name: same-target-core19-readiness-diagnostic-v0-4

on:
  push:
    branches: [successor-reference-finite-frame-repair]
    paths: [config/product_b_same_target_core19_readiness_diagnostic_trigger_v0_4.json]

permissions:
  contents: read
  actions: read

concurrency:
  group: same-target-core19-readiness-diagnostic-v0-4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    runs-on: ubuntu-latest
    outputs:
      successor_run: ${{ steps.gate.outputs.successor_run }}
      heldout_run: ${{ steps.gate.outputs.heldout_run }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - id: gate
        name: Validate readiness diagnostic is outcome-blind and exact-parent pinned
        run: |
          python -m py_compile scripts/diagnose_same_target_core19_readiness_v0_4.py
          python - <<'PY'
          import json,os
          c=json.load(open('config/product_b_same_target_core19_requalification_contract_v0_4.json')); a=json.load(open('config/product_b_same_target_core19_readiness_diagnostic_trigger_v0_4.json')); p=c['all43_v0_3_parent_provenance']
          exact={'authorization_version':'product_b_same_target_core19_readiness_diagnostic_authorization_v0.4','contract_version':'product_b_same_target_core19_requalification_v0.4','diagnostic_authorized':True,'model_fit_authorized':False,'prediction_scores_authorized':False,'paired_discordance_authorized':False,'reference_ceiling_authorized':False,'heldout_pairing_authorized':False,'process_knockout_authorized':False,'counts_as_empirical_conclusion':False}
          for k,v in exact.items():
              if a.get(k)!=v: raise RuntimeError(f'readiness authorization drift: {k}')
          for k in ('successor_run_id','successor_head_sha','successor_summary_artifact_id','successor_summary_artifact_digest','heldout_run_id','heldout_head_sha','heldout_summary_artifact_id','heldout_summary_artifact_digest'):
              if a.get(k)!=p.get(k): raise RuntimeError(f'readiness parent identity drift: {k}')
          with open(os.environ['GITHUB_OUTPUT'],'a') as h: h.write(f"successor_run={p['successor_run_id']}\nheldout_run={p['heldout_run_id']}\n")
          PY

  prepare-targets:
    needs: validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - name: Retrieve exact frozen target groups
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          pairs=[('results/product_b_same_target_successor_target_footprint_receipt_v0_1.json','product-b-successor-same-target-target-footprint-2026-08-01','successor'),('results/product_b_same_target_source_target_footprint_receipt_v0_1.json','product-b-same-target-target-footprint-2026-08-01','heldout')]
          for receipt,name,out in pairs:
              c=json.load(open(receipt)); subprocess.run(['gh','run','download',str(c['workflow_run_id']),'-R','zuizui0223/284b','-n',name,'-D',out],check=True); p=Path(out)/'target_group.parquet'
              if hashlib.sha256(p.read_bytes()).hexdigest()!=c['target_sha256']: raise RuntimeError(f'{out} target bytes changed')
          PY
      - uses: actions/upload-artifact@v4
        with: {name: product-b-core19-readiness-v0-4-target-groups, path: |
            successor/target_group.parquet
            heldout/target_group.parquet, if-no-files-found: error, retention-days: 30}

  successor:
    needs: [validation, prepare-targets]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: {taxon_index: [15,20,37,46]}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          git clone --quiet https://github.com/zuizui0223/sdmr.git sdmr
          git -C sdmr checkout --quiet 9d2a45b56408cde8a4af41722538d0086c532cc9
          python -m pip install --disable-pip-version-check --quiet -e './sdmr[cloud,parquet,geo]'
          python -m pip install --disable-pip-version-check --quiet 'pyarrow==21.0.0' joblib
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with: {repository: zuizui0223/284b, github-token: '${{ github.token }}', run-id: '${{ needs.validation.outputs.successor_run }}', name: 'product-b-successor-finite-frame-v0-3-preflight-taxon-${{ matrix.taxon_index }}', path: parent, digest-mismatch: error}
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with: {name: product-b-core19-readiness-v0-4-target-groups, path: targets, digest-mismatch: error}
      - env: {PYTHONPATH: '.', SDMR_RASTER_LAYER_JOBS: '4'}
        run: >-
          python scripts/diagnose_same_target_core19_readiness_v0_4.py --panel successor --taxon-index ${{ matrix.taxon_index }}
          --parent-v0-3-dir parent --target-group targets/successor/target_group.parquet --chelsa-manifest sdmr/configs/chelsa_v2_1_plant_candidates.csv --output-dir out
      - uses: actions/upload-artifact@v4
        with: {name: 'product-b-core19-readiness-v0-4-successor-${{ matrix.taxon_index }}', path: out/, if-no-files-found: error, retention-days: 90}

  heldout:
    needs: [validation, prepare-targets]
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: {taxon_index: [7,10]}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          git clone --quiet https://github.com/zuizui0223/sdmr.git sdmr
          git -C sdmr checkout --quiet 9d2a45b56408cde8a4af41722538d0086c532cc9
          python -m pip install --disable-pip-version-check --quiet -e './sdmr[cloud,parquet,geo]'
          python -m pip install --disable-pip-version-check --quiet 'pyarrow==21.0.0' joblib
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with: {repository: zuizui0223/284b, github-token: '${{ github.token }}', run-id: '${{ needs.validation.outputs.heldout_run }}', name: 'product-b-heldout-finite-frame-v0-3-preflight-taxon-${{ matrix.taxon_index }}', path: parent, digest-mismatch: error}
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with: {name: product-b-core19-readiness-v0-4-target-groups, path: targets, digest-mismatch: error}
      - env: {PYTHONPATH: '.', SDMR_RASTER_LAYER_JOBS: '4'}
        run: >-
          python scripts/diagnose_same_target_core19_readiness_v0_4.py --panel heldout --taxon-index ${{ matrix.taxon_index }}
          --parent-v0-3-dir parent --target-group targets/heldout/target_group.parquet --chelsa-manifest sdmr/configs/chelsa_v2_1_plant_candidates.csv --output-dir out
      - uses: actions/upload-artifact@v4
        with: {name: 'product-b-core19-readiness-v0-4-heldout-${{ matrix.taxon_index }}', path: out/, if-no-files-found: error, retention-days: 90}

  aggregate:
    needs: [successor,heldout]
    if: always() && needs.successor.result == 'success' && needs.heldout.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pandas
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with: {pattern: product-b-core19-readiness-v0-4-*, path: results, digest-mismatch: error}
      - name: Aggregate exact 14-cell readiness gate
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          import pandas as pd
          summaries=[]; cells=[]
          for p in sorted(Path('results').rglob('summary.json')):
              s=json.load(open(p)); summaries.append(s); cells.append(pd.read_csv(p.parent/'core19_readiness_cells.csv'))
          if len(summaries)!=6: raise RuntimeError(f'expected 6 readiness summaries, got {len(summaries)}')
          f=pd.concat(cells,ignore_index=True).sort_values(['panel','taxon_index','M_km'])
          if len(f)!=14 or int((f.panel=='successor').sum())!=10 or int((f.panel=='heldout').sum())!=4: raise RuntimeError('readiness 14-cell inventory drifted')
          for s in summaries:
              for k in ('model_fit_opened','prediction_scores_computed','paired_discordance_opened','reference_ceiling_opened_or_read','heldout_pairing_opened','process_knockout_opened'):
                  if s.get(k) is not False: raise RuntimeError(f'readiness crossed boundary: {k}')
          out={'result_version':'product_b_same_target_core19_readiness_diagnostic_summary_v0.4','workflow_run_id':int(os.environ['GITHUB_RUN_ID']),'affected_taxa':6,'v0_3_unresolved_cells':14,'successor_unresolved_cells_reproduced':10,'heldout_unresolved_cells_reproduced':4,'active_predictors':[f'bio{i}' for i in range(1,20)],'active_predictor_count':19,'core19_cells_ready_for_2000':int(f.core19_ready_for_2000.astype(bool).sum()),'core19_cells_not_ready_for_2000':int((~f.core19_ready_for_2000.astype(bool)).sum()),'all_14_unresolved_cells_core19_ready_for_2000':bool(f.core19_ready_for_2000.astype(bool).all()),'minimum_core19_finite_rows':int(f.core19_finite_rows.min()),'model_fit_opened':False,'prediction_scores_computed':False,'paired_discordance_opened':False,'reference_ceiling_opened_or_read':False,'heldout_pairing_opened':False,'process_knockout_opened':False,'counts_as_empirical_conclusion':False}
          Path('summary').mkdir(exist_ok=True); f.to_csv('summary/core19_readiness_cells.csv',index=False); Path('summary/summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,indent=2,sort_keys=True)); print(f.to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: product-b-core19-readiness-v0-4-summary, path: summary/, if-no-files-found: error, retention-days: 90}
