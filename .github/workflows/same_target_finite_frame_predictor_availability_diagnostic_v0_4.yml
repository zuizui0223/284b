name: same-target-finite-frame-predictor-availability-diagnostic-v0-4

on:
  push:
    branches: [successor-reference-finite-frame-repair]
    paths: [config/product_b_same_target_finite_frame_predictor_availability_diagnostic_trigger_v0_4.json]

permissions:
  contents: read
  actions: read

concurrency:
  group: same-target-finite-frame-predictor-availability-diagnostic-v0-4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    runs-on: ubuntu-latest
    outputs:
      successor_run_id: ${{ steps.gate.outputs.successor_run_id }}
      heldout_run_id: ${{ steps.gate.outputs.heldout_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: gate
        name: Validate exact v0.3 structural-unavailability parents and closed outcomes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile scripts/diagnose_same_target_finite_frame_predictor_availability_v0_4.py
          python - <<'PY'
          import json, os, subprocess
          a=json.load(open('config/product_b_same_target_finite_frame_predictor_availability_diagnostic_trigger_v0_4.json'))
          exact={
            'authorization_version':'product_b_same_target_finite_frame_predictor_availability_diagnostic_authorization_v0.4',
            'repair_branch':'successor-reference-finite-frame-repair',
            'diagnostic_authorized':True,
            'model_fit_authorized':False,
            'prediction_scores_authorized':False,
            'paired_discordance_authorized':False,
            'reference_ceiling_authorized':False,
            'heldout_pairing_authorized':False,
            'process_knockout_authorized':False,
            'counts_as_empirical_conclusion':False,
            'successor_v0_3_expected_unresolved_cells':10,
            'heldout_v0_3_expected_unresolved_cells':4,
          }
          for k,v in exact.items():
              if a.get(k)!=v: raise RuntimeError(f'v0.4 diagnostic authorization drift: {k}')

          def verify(prefix, artifact_name, summary_file, required):
              rid=int(a[f'{prefix}_run_id'])
              run=json.loads(subprocess.check_output(['gh','api',f'/repos/zuizui0223/284b/actions/runs/{rid}'],text=True))
              if run.get('status')!='completed' or run.get('conclusion')!='success': raise RuntimeError(f'{prefix} parent not completed success')
              if run.get('head_sha')!=a[f'{prefix}_head_sha']: raise RuntimeError(f'{prefix} parent head SHA mismatch')
              arts=json.loads(subprocess.check_output(['gh','api',f'/repos/zuizui0223/284b/actions/runs/{rid}/artifacts?per_page=100'],text=True)).get('artifacts',[])
              xs=[x for x in arts if x.get('name')==artifact_name]
              if len(xs)!=1 or xs[0].get('expired') is True: raise RuntimeError(f'{prefix} summary missing/duplicate/expired')
              if int(xs[0]['id'])!=int(a[f'{prefix}_summary_artifact_id']) or str(xs[0].get('digest'))!=str(a[f'{prefix}_summary_artifact_digest']): raise RuntimeError(f'{prefix} summary identity mismatch')
              d=f'{prefix}_summary'
              subprocess.run(['gh','run','download',str(rid),'-R','zuizui0223/284b','-n',artifact_name,'-D',d],check=True)
              s=json.load(open(f'{d}/{summary_file}'))
              for k,v in required.items():
                  if s.get(k)!=v: raise RuntimeError(f'{prefix} v0.3 structural parent mismatch: {k}={s.get(k)!r}')
              return rid

          sr=verify(
            'successor_v0_3',
            'product-b-successor-finite-frame-v0-3-preflight-summary',
            'finite_frame_preflight_summary.json',
            {
              'result_version':'product_b_same_target_successor_finite_frame_preflight_v0.3',
              'taxa_expected':47,'taxa_with_receipts':47,
              'taxon_M_cells_expected':141,'taxon_M_cells_observed':141,
              'taxon_M_cells_frozen':131,'taxon_M_cells_unresolved':10,
              'all_141_frames_ready_for_review':False,
              'model_refit_opened':False,'prediction_scores_computed':False,
              'paired_discordance_opened':False,'reference_ceiling_computed':False,
              'heldout_12_paired_discordance_read':False,'process_knockout_opened':False,
              'counts_as_empirical_conclusion':False,
            },
          )
          hr=verify(
            'heldout_v0_3',
            'product-b-heldout-finite-frame-v0-3-preflight-summary',
            'heldout_finite_frame_preflight_summary.json',
            {
              'result_version':'product_b_same_target_heldout_finite_frame_preflight_v0.3',
              'heldout_taxa_expected':12,'heldout_taxa_with_receipts':12,
              'taxon_M_cells_expected':36,'taxon_M_cells_observed':36,
              'taxon_M_cells_frozen':32,'taxon_M_cells_unresolved':4,
              'all_36_frames_ready_for_review':False,
              'model_refit_opened':False,'prediction_scores_computed':False,
              'paired_discordance_opened':False,'reference_ceiling_read':False,
              'heldout_pairing_opened':False,'process_knockout_opened':False,
              'counts_as_empirical_conclusion':False,
            },
          )
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as h:
              h.write(f'successor_run_id={sr}\nheldout_run_id={hr}\n')
          PY

  prepare-successor-target:
    needs: validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - name: Retrieve exact frozen successor target group
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          c=json.load(open('results/product_b_same_target_successor_target_footprint_receipt_v0_1.json'))
          subprocess.run(['gh','run','download',str(c['workflow_run_id']),'-R','zuizui0223/284b','-n','product-b-successor-same-target-target-footprint-2026-08-01','-D','target_source'],check=True)
          p=Path('target_source/target_group.parquet')
          if hashlib.sha256(p.read_bytes()).hexdigest()!=c['target_sha256']: raise RuntimeError('successor target-group bytes changed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: product-b-v0-4-diagnostic-successor-target-group
          path: target_source/target_group.parquet
          if-no-files-found: error
          retention-days: 30

  prepare-heldout-target:
    needs: validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - name: Retrieve exact frozen held-out target group
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          c=json.load(open('results/product_b_same_target_source_target_footprint_receipt_v0_1.json'))
          subprocess.run(['gh','run','download',str(c['workflow_run_id']),'-R','zuizui0223/284b','-n','product-b-same-target-target-footprint-2026-08-01','-D','target_source'],check=True)
          p=Path('target_source/target_group.parquet')
          if hashlib.sha256(p.read_bytes()).hexdigest()!=c['target_sha256']: raise RuntimeError('held-out target-group bytes changed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: product-b-v0-4-diagnostic-heldout-target-group
          path: target_source/target_group.parquet
          if-no-files-found: error
          retention-days: 30

  diagnose-successor:
    needs: [validation, prepare-successor-target]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        taxon_index: [15, 20, 37, 46]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install unchanged pinned environmental implementation
        run: |
          git clone --quiet https://github.com/zuizui0223/sdmr.git sdmr
          git -C sdmr checkout --quiet 9d2a45b56408cde8a4af41722538d0086c532cc9
          python -m pip install --disable-pip-version-check --quiet -e './sdmr[cloud,parquet,geo]'
          python -m pip install --disable-pip-version-check --quiet 'pyarrow==21.0.0' joblib
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          repository: zuizui0223/284b
          github-token: ${{ github.token }}
          run-id: ${{ needs.validation.outputs.successor_run_id }}
          name: product-b-successor-finite-frame-v0-3-preflight-taxon-${{ matrix.taxon_index }}
          path: parent_v03
          digest-mismatch: error
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: product-b-v0-4-diagnostic-successor-target-group
          path: target_source
          digest-mismatch: error
      - name: Diagnose predictor availability without opening any model outcome
        env: {PYTHONPATH: '.', SDMR_RASTER_LAYER_JOBS: '4'}
        run: >-
          python scripts/diagnose_same_target_finite_frame_predictor_availability_v0_4.py
          --panel successor --taxon-index ${{ matrix.taxon_index }}
          --parent-v0-3-dir parent_v03 --target-group target_source/target_group.parquet
          --chelsa-manifest sdmr/configs/chelsa_v2_1_plant_candidates.csv
          --output-dir diagnostic
      - uses: actions/upload-artifact@v4
        with:
          name: product-b-v0-4-predictor-availability-successor-${{ matrix.taxon_index }}
          path: diagnostic/
          if-no-files-found: error
          retention-days: 90

  diagnose-heldout:
    needs: [validation, prepare-heldout-target]
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        taxon_index: [7, 10]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install unchanged pinned environmental implementation
        run: |
          git clone --quiet https://github.com/zuizui0223/sdmr.git sdmr
          git -C sdmr checkout --quiet 9d2a45b56408cde8a4af41722538d0086c532cc9
          python -m pip install --disable-pip-version-check --quiet -e './sdmr[cloud,parquet,geo]'
          python -m pip install --disable-pip-version-check --quiet 'pyarrow==21.0.0' joblib
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          repository: zuizui0223/284b
          github-token: ${{ github.token }}
          run-id: ${{ needs.validation.outputs.heldout_run_id }}
          name: product-b-heldout-finite-frame-v0-3-preflight-taxon-${{ matrix.taxon_index }}
          path: parent_v03
          digest-mismatch: error
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: product-b-v0-4-diagnostic-heldout-target-group
          path: target_source
          digest-mismatch: error
      - name: Diagnose held-out predictor availability with endpoint sealed
        env: {PYTHONPATH: '.', SDMR_RASTER_LAYER_JOBS: '4'}
        run: >-
          python scripts/diagnose_same_target_finite_frame_predictor_availability_v0_4.py
          --panel heldout --taxon-index ${{ matrix.taxon_index }}
          --parent-v0-3-dir parent_v03 --target-group target_source/target_group.parquet
          --chelsa-manifest sdmr/configs/chelsa_v2_1_plant_candidates.csv
          --output-dir diagnostic
      - uses: actions/upload-artifact@v4
        with:
          name: product-b-v0-4-predictor-availability-heldout-${{ matrix.taxon_index }}
          path: diagnostic/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: [diagnose-successor, diagnose-heldout]
    if: always() && needs.diagnose-successor.result == 'success' && needs.diagnose-heldout.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pandas numpy
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          pattern: product-b-v0-4-predictor-availability-*
          path: diagnostics
          digest-mismatch: error
      - name: Aggregate all 14 v0.3-unresolved cells
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import pandas as pd
          summaries=[]; cells=[]; predictors=[]
          for p in sorted(Path('diagnostics').rglob('summary.json')):
              s=json.load(open(p))
              if s.get('result_version')!='product_b_same_target_finite_frame_predictor_availability_diagnostic_v0.4': raise RuntimeError('foreign v0.4 diagnostic')
              for k in ('model_fit_opened','prediction_scores_computed','paired_discordance_opened','reference_ceiling_opened_or_read','heldout_pairing_opened','process_knockout_opened'):
                  if s.get(k) is not False: raise RuntimeError(f'diagnostic crossed boundary: {k}')
              if s.get('counts_as_empirical_conclusion') is not False: raise RuntimeError('diagnostic incorrectly marked empirical')
              summaries.append(s)
              cells.append(pd.read_csv(p.parent/'cell_availability.csv'))
              predictors.append(pd.read_csv(p.parent/'predictor_missingness.csv'))
          if len(summaries)!=6: raise RuntimeError(f'expected 6 affected taxa, got {len(summaries)}')
          cell=pd.concat(cells,ignore_index=True).sort_values(['panel','taxon_index','M_km'])
          pred=pd.concat(predictors,ignore_index=True).sort_values(['panel','taxon_index','M_km','predictor'])
          if len(cell)!=14: raise RuntimeError(f'expected exact 14 unresolved cells, got {len(cell)}')
          if int((cell['panel']=='successor').sum())!=10 or int((cell['panel']=='heldout').sum())!=4: raise RuntimeError('v0.3 unresolved panel counts drifted')
          agg=(pred.groupby(['predictor','candidate_class'],as_index=False)
               .agg(total_missing_rows=('missing_rows','sum'),max_missing_fraction=('missing_fraction','max'),max_single_drop_gain=('gain_if_only_this_predictor_removed','max'))
               .sort_values(['total_missing_rows','predictor'],ascending=[False,True]))
          summary={
            'result_version':'product_b_same_target_finite_frame_predictor_availability_diagnostic_summary_v0.4',
            'workflow_run_id':int(os.environ['GITHUB_RUN_ID']),
            'affected_taxa':6,'v0_3_unresolved_cells':14,
            'successor_unresolved_cells_reproduced':10,'heldout_unresolved_cells_reproduced':4,
            'core_predictor_rule':'manifest candidate_class == core_climate',
            'core_predictor_count':19,
            'core19_cells_ready_for_2000':int(cell['core19_ready_for_2000'].sum()),
            'core19_cells_not_ready_for_2000':int((~cell['core19_ready_for_2000'].astype(bool)).sum()),
            'all_14_unresolved_cells_core19_ready_for_2000':bool(cell['core19_ready_for_2000'].astype(bool).all()),
            'minimum_core19_finite_rows':int(cell['core19_finite_rows'].min()),
            'model_fit_opened':False,'prediction_scores_computed':False,'paired_discordance_opened':False,
            'reference_ceiling_opened_or_read':False,'heldout_pairing_opened':False,'process_knockout_opened':False,
            'counts_as_empirical_conclusion':False,
            'claim_strength':'predictor_availability_diagnostic_only_not_empirical_evidence',
          }
          out=Path('summary'); out.mkdir(exist_ok=True)
          cell.to_csv(out/'cell_availability.csv',index=False)
          pred.to_csv(out/'predictor_missingness.csv',index=False)
          agg.to_csv(out/'predictor_missingness_aggregate.csv',index=False)
          (out/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          print(agg.head(15).to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: product-b-v0-4-predictor-availability-diagnostic-summary
          path: summary/
          if-no-files-found: error
          retention-days: 90
