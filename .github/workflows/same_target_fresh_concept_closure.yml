name: same-target-fresh-concept-closure

on:
  push:
    branches:
      - product-b-v5-obligate-invariant
    paths:
      - config/product_b_same_target_fresh_concept_closure_trigger_v0_1.json

permissions:
  contents: write

jobs:
  review-and-close:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify taxonomy-only closure boundary
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile scripts/run_same_target_fresh_historical_name_review.py scripts/evaluate_same_target_fresh_snapshot_concept_closure.py
          python - <<'PY'
          import json
          tuples=json.load(open('results/product_b_same_target_fresh_snapshot_concept_tuples_v0_1.json'))
          trigger=json.load(open('config/product_b_same_target_fresh_concept_closure_trigger_v0_1.json'))
          assert tuples['current_name_review_authorized'] is True
          assert tuples['taxa_with_nonempty_snapshot_taxonomy_tuples'] >= tuples['frozen_calibration_minimum_taxa']
          assert tuples['occurrence_sampling_authorized'] is False
          assert tuples['matched_row_counts_persisted'] is False
          assert tuples['raw_occurrence_rows_persisted'] is False
          assert tuples['coordinates_opened'] is False
          assert tuples['current_layer1_paired_discordance_read'] is False
          assert trigger['historical_name_review_authorized'] is True
          assert trigger['concept_closure_authorized'] is True
          assert trigger['occurrence_sampling_authorized_before_closure'] is False
          PY
      - name: Review every represented historical snapshot name in current taxonomy
        env:
          PYTHONPATH: .
        run: python scripts/run_same_target_fresh_historical_name_review.py
      - name: Apply all-key species concept closure
        env:
          PYTHONPATH: .
        run: python scripts/evaluate_same_target_fresh_snapshot_concept_closure.py
      - name: Upload taxonomy-only closure artifacts
        uses: actions/upload-artifact@v4
        with:
          name: product-b-fresh-snapshot-concept-closure
          path: |
            results/product_b_same_target_fresh_historical_name_review_v0_1.json
            results/product_b_same_target_fresh_snapshot_concept_closure_v0_1.json
            registry/product_b_same_target_fresh_snapshot_keysets_v0_1.csv
          if-no-files-found: error
          retention-days: 90
      - name: Commit taxonomy-only closure audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/product_b_same_target_fresh_historical_name_review_v0_1.json results/product_b_same_target_fresh_snapshot_concept_closure_v0_1.json registry/product_b_same_target_fresh_snapshot_keysets_v0_1.csv
          if git diff --cached --quiet; then
            echo "No fresh concept closure result change to commit"
          else
            git commit -m "Record fresh snapshot species concept closure"
            git pull --rebase origin product-b-v5-obligate-invariant
            git push origin HEAD:product-b-v5-obligate-invariant
          fi
