name: same-target-fresh-snapshot-concept

on:
  push:
    branches:
      - product-b-v5-obligate-invariant
    paths:
      - config/product_b_same_target_fresh_snapshot_concept_trigger_v0_1.json

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify fresh concept-closure boundary before snapshot access
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile scripts/run_same_target_fresh_snapshot_concept_shard.py scripts/aggregate_same_target_fresh_snapshot_concept_shards.py
          python - <<'PY'
          import json
          current=json.load(open('results/product_b_same_target_fresh_current_taxonomy_v0_1.json'))
          contract=json.load(open('config/product_b_same_target_fresh_calibration_contract_v0_1.json'))
          trigger=json.load(open('config/product_b_same_target_fresh_snapshot_concept_trigger_v0_1.json'))
          minimum=int(contract['panel_rule']['minimum_complete_taxa_for_calibration'])
          assert current['resolved_exact_accepted_species'] >= minimum
          assert current['unresolved_current_taxonomy'] == 0
          assert current['snapshot_taxonomy_opened'] is False
          assert current['occurrence_counts_opened'] is False
          assert current['coordinates_opened'] is False
          assert current['paired_discordance_opened'] is False
          assert trigger['snapshot_taxonomy_only_authorized'] is True
          assert trigger['occurrence_sampling_authorized'] is False
          assert trigger['current_layer1_paired_outcomes_read'] is False
          PY

  concept-shards:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install taxonomy-only snapshot scanner
        run: python -m pip install --disable-pip-version-check --quiet "pyarrow==21.0.0"
      - name: Scan deterministic frozen snapshot taxonomy shard
        env:
          PYTHONPATH: .
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: "6"
        run: python scripts/run_same_target_fresh_snapshot_concept_shard.py
      - name: Upload distinct taxonomy tuples only
        uses: actions/upload-artifact@v4
        with:
          name: product-b-fresh-snapshot-concept-shard-${{ matrix.shard }}
          path: artifacts/product_b_same_target_fresh_snapshot_concept_shard_${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: concept-shards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download fresh taxonomy-only shard tuples
        uses: actions/download-artifact@v4
        with:
          pattern: product-b-fresh-snapshot-concept-shard-*
          merge-multiple: true
          path: artifacts/fresh_snapshot_concept_shards
      - name: Union taxonomy tuples without matched-row counts
        env:
          PYTHONPATH: .
        run: python scripts/aggregate_same_target_fresh_snapshot_concept_shards.py
      - name: Upload aggregate concept tuple audit
        uses: actions/upload-artifact@v4
        with:
          name: product-b-fresh-snapshot-concept-tuples
          path: results/product_b_same_target_fresh_snapshot_concept_tuples_v0_1.json
          if-no-files-found: error
          retention-days: 90
      - name: Commit taxonomy-only concept tuple audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/product_b_same_target_fresh_snapshot_concept_tuples_v0_1.json
          if git diff --cached --quiet; then
            echo "No fresh snapshot concept tuple result change to commit"
          else
            git commit -m "Record fresh snapshot taxonomy concept tuples"
            git pull --rebase origin product-b-v5-obligate-invariant
            git push origin HEAD:product-b-v5-obligate-invariant
          fi
