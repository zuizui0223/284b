name: same-target-successor-current-taxonomy

on:
  push:
    branches:
      - product-b-v5-obligate-invariant
    paths:
      - config/product_b_same_target_successor_current_taxonomy_trigger_v0_1.json

permissions:
  contents: write

jobs:
  current-taxonomy-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify successor taxonomy-only boundary
        run: |
          python -m py_compile scripts/run_same_target_successor_current_taxonomy.py
          python - <<'PY'
          import csv,json
          c=json.load(open('config/product_b_same_target_successor_calibration_contract_v0_1.json'))
          rows=list(csv.DictReader(open(c['candidate_registry'], newline='', encoding='utf-8')))
          used=list(csv.DictReader(open(c['freshness_firewall']['local_prior_consumed_registry'], newline='', encoding='utf-8')))
          assert len(rows)==72 and len({r['scientific_name'] for r in rows})==72
          assert len(used)==84 and len({r['scientific_name'] for r in used})==84
          assert not ({r['scientific_name'] for r in rows} & {r['scientific_name'] for r in used})
          assert c['taxonomy_concept_closure']['rank_whitelist_forbidden'] is True
          assert c['taxonomy_concept_closure']['taxonrank_is_audited_but_is_not_an_exclusion_gate'] is True
          PY
      - name: Resolve all 72 successor taxa against current GBIF taxonomy
        env:
          PYTHONPATH: .
        run: python scripts/run_same_target_successor_current_taxonomy.py
      - name: Upload taxonomy-only result
        uses: actions/upload-artifact@v4
        with:
          name: product-b-successor-current-taxonomy
          path: results/product_b_same_target_successor_current_taxonomy_v0_1.json
          if-no-files-found: error
          retention-days: 90
      - name: Commit taxonomy-only audit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/product_b_same_target_successor_current_taxonomy_v0_1.json
          if git diff --cached --quiet; then
            echo "No successor taxonomy result change to commit"
          else
            git commit -m "Record successor current taxonomy audit"
            git pull --rebase origin product-b-v5-obligate-invariant
            git push origin HEAD:product-b-v5-obligate-invariant
          fi
