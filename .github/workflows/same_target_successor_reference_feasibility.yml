name: same-target-successor-reference-feasibility

on:
  push:
    branches:
      - product-b-v5-obligate-invariant
    paths:
      - config/product_b_same_target_successor_reference_feasibility_trigger_v0_1.json

permissions:
  contents: write
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify pre-discordance reference-feasibility boundary
        run: |
          python -m pip install --disable-pip-version-check --quiet pandas
          python -m py_compile scripts/audit_same_target_successor_reference_feasibility.py
          python -m unittest tests.test_reference_feasibility -v
          python - <<'PY'
          import json
          c=json.load(open('config/product_b_same_target_successor_reference_feasibility_contract_v0_1.json'))
          f=json.load(open('results/product_b_same_target_successor_layer1_fit_v0_1.json'))
          t=json.load(open('config/product_b_same_target_successor_reference_feasibility_trigger_v0_1.json'))
          assert c['minimum_eligible_taxa_per_procedure_M']==30
          assert c['paired_prediction_surface_read_forbidden'] is True
          assert c['schoener_d_computation_forbidden'] is True
          assert c['reference_ceiling_computation_forbidden'] is True
          assert f['paired_discordance_opened'] is False
          assert f['prediction_surfaces_opened_for_pairing'] is False
          assert f['process_knockout_opened'] is False
          assert int(t['successor_fit_workflow_run_id']) > 0
          assert t['paired_prediction_surfaces_read'] is False
          assert t['heldout_12_paired_discordance_read'] is False
          PY
      - name: Resolve frozen successor fit run
        id: trigger
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          t=json.load(open('config/product_b_same_target_successor_reference_feasibility_trigger_v0_1.json'))
          print('run_id='+str(int(t['successor_fit_workflow_run_id'])))
          PY
      - name: Download sealed successor fit artifacts
        uses: actions/download-artifact@v4
        with:
          repository: zuizui0223/284b
          github-token: ${{ github.token }}
          run-id: ${{ steps.trigger.outputs.run_id }}
          pattern: product-b-successor-layer1-fit-taxon-*
          path: fit_artifacts
      - name: Audit reference feasibility without reading predictions
        env:
          PYTHONPATH: .
        run: |
          python scripts/audit_same_target_successor_reference_feasibility.py \
            --input-root fit_artifacts \
            --fit-audit results/product_b_same_target_successor_layer1_fit_v0_1.json \
            --output results/product_b_same_target_successor_reference_feasibility_v0_1.json
      - name: Commit pre-discordance feasibility audit only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/product_b_same_target_successor_reference_feasibility_v0_1.json
          if git diff --cached --quiet; then
            echo "No reference-feasibility audit change"
          else
            git commit -m "Record successor pre-discordance reference feasibility"
            git pull --rebase origin product-b-v5-obligate-invariant
            git push origin HEAD:product-b-v5-obligate-invariant
          fi
