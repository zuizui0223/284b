name: Stage forecast complementary three census cohort
on:
  push:
    branches: [analysis/niche-demographic-divergence-20261127]
    paths: ['scripts/stage_forecast_complementary_three_census.py', '.github/workflows/stage-forecast-complementary-three-census.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forecast:
    strategy:
      fail-fast: false
      matrix:
        region: [central_hardwoods, southern_uplands]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy requests rasterio
      - run: python scripts/stage_forecast_complementary_three_census.py --region ${{ matrix.region }} --data build/fia-raw --out build/complementary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-forecast-complementary-${{ matrix.region }}
          path: build/complementary/
          if-no-files-found: warn
          retention-days: 30
