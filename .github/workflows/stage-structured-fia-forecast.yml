name: Stage structured FIA temporal forecast
on:
  push:
    branches: [analysis/niche-demographic-divergence-20261127]
    paths: ['scripts/stage_structured_fia_forecast.py', '.github/workflows/stage-structured-fia-forecast.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forecast:
    strategy:
      fail-fast: false
      matrix:
        region: [northeast, appalachia, great_lakes]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy requests rasterio
      - run: python scripts/stage_structured_fia_forecast.py --region ${{ matrix.region }} --data build/fia-raw --out build/stage-forecast
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-structured-fia-forecast-${{ matrix.region }}
          path: build/stage-forecast/
          if-no-files-found: warn
          retention-days: 30
