name: tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run active Level-A unittest suite
        run: python -m unittest discover -s tests -v
      - name: Run Paper 1 function-style submission guards
        run: python scripts/run_paper1_function_guards.py
