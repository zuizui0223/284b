name: v7-1-jos001-manual-taxonomy-review

# Retrigger after v2 diagnostics parsing fix; taxonomy request unchanged.
on:
  push:
    branches:
      - product-b-v5-obligate-invariant
    paths:
      - .github/workflows/v7_1_jos001_manual_taxonomy_review.yml

permissions:
  contents: read

jobs:
  taxonomy-review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify repository tests before taxonomy review
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
      - name: Review JOS001 moth taxonomy bridge only
        env:
          PYTHONPATH: .
        run: python scripts/run_v7_1_jos001_manual_taxonomy_review.py
      - name: Upload JOS001 manual taxonomy review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-b-v7-1-jos001-manual-taxonomy-review
          path: artifacts/product_b_v7_1_jos001_manual_taxonomy_review.json
          if-no-files-found: error
          retention-days: 90
