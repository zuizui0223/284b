name: v7-2-jos002-snapshot-taxonomy

on:
  push:
    branches:
      - product-b-v5-obligate-invariant
    paths:
      - .github/workflows/v7_2_jos002_snapshot_taxonomy.yml

permissions:
  contents: read

jobs:
  taxonomy-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify repository tests before taxonomy access
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
      - name: Resolve JOS002 against current GBIF taxonomy only
        env:
          PYTHONPATH: .
        run: python scripts/run_v7_2_jos002_snapshot_taxonomy.py
      - name: Upload JOS002 snapshot taxonomy audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-b-v7-2-jos002-snapshot-taxonomy
          path: artifacts/product_b_v7_2_jos002_snapshot_taxonomy.json
          if-no-files-found: error
          retention-days: 90
