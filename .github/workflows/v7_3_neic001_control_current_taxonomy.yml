name: v7-3-neic001-control-current-taxonomy

on:
  push:
    branches:
      - product-b-v5-obligate-invariant
    paths:
      - .github/workflows/v7_3_neic001_control_current_taxonomy.yml

permissions:
  contents: read

jobs:
  taxonomy-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify repository tests before control taxonomy access
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
      - name: Resolve exact frozen NEIC001 controls against current taxonomy
        env:
          PYTHONPATH: .
        run: python scripts/run_v7_3_neic001_control_current_taxonomy.py
      - name: Upload NEIC001 control current-taxonomy audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-b-v7-3-neic001-control-current-taxonomy
          path: artifacts/product_b_v7_3_neic001_control_current_taxonomy.json
          if-no-files-found: error
          retention-days: 90
