<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="108mm" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="white"/>
<text x="60" y="55" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:30px;font-weight:bold;">Figure 1. Independent acoustic systems test the same short-window co-calling prediction</text>
<rect x="55" y="100" width="500" height="235" rx="24" fill="#f7f7f7" stroke="#111" stroke-width="2"/>
<text x="80" y="140" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:28px;font-weight:bold;">NAAMP — North America</text>
<text x="80" y="178" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:normal;">Standardized 5-min route stops</text>
<text x="80" y="210" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:normal;">9,399 runs · 900 routes · 93,383 stops</text>
<rect x="90" y="235" width="185" height="62" rx="14" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="182" y="273" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:bold;">recent rainfall</text>
<text x="305" y="273" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:34px;font-weight:bold;">→</text>
<rect x="335" y="235" width="185" height="62" rx="14" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="427" y="263" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:19px;font-weight:bold;">≥2 calling species</text>
<text x="427" y="286" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:normal;">at a stop</text>
<rect x="645" y="100" width="500" height="235" rx="24" fill="#f7f7f7" stroke="#111" stroke-width="2"/>
<text x="670" y="140" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:28px;font-weight:bold;">FrogID — Australia</text>
<text x="670" y="178" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:normal;">Expert-validated short recordings</text>
<text x="670" y="210" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:normal;">40,754 recordings · 13,148 recorders</text>
<rect x="680" y="235" width="185" height="62" rx="14" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="772" y="273" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:bold;">recent rainfall</text>
<text x="895" y="273" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:34px;font-weight:bold;">→</text>
<rect x="925" y="225" width="185" height="82" rx="14" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="1018" y="252" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:bold;">1 vs ≥2 calling</text>
<text x="1018" y="276" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;font-weight:normal;">species, conditional</text>
<text x="1018" y="298" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;font-weight:normal;">on ≥1 already calling</text>
<line x1="305" y1="335" x2="305" y2="405" stroke="#111" stroke-width="3"/>
<line x1="895" y1="335" x2="895" y2="405" stroke="#111" stroke-width="3"/>
<line x1="305" y1="405" x2="600" y2="455" stroke="#111" stroke-width="3"/>
<line x1="895" y1="405" x2="600" y2="455" stroke="#111" stroke-width="3"/>
<rect x="305" y="445" width="590" height="108" rx="20" fill="#efefef" stroke="#111" stroke-width="3"/>
<text x="600" y="482" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:25px;font-weight:bold;">Cross-system directional claim</text>
<text x="600" y="516" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:normal;">More recent rainfall ↔ greater short-window multispecies co-calling</text>
<text x="600" y="542" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:normal;">No pooling of effect sizes</text>
<rect x="120" y="585" width="390" height="70" rx="16" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="315" y="614" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:bold;">NAAMP robustness</text>
<text x="315" y="642" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:19px;font-weight:normal;">within the same route</text>
<rect x="690" y="585" width="390" height="70" rx="16" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="885" y="614" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:bold;">FrogID robustness</text>
<text x="885" y="642" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:19px;font-weight:normal;">within the same ERA5 cell</text>
<line x1="510" y1="620" x2="690" y2="620" stroke="#111" stroke-width="2" stroke-dasharray="8 8"/>
<text x="600" y="697" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;font-weight:normal;">Association, not causation · no facilitation or network-rewiring inference</text>
</svg>
