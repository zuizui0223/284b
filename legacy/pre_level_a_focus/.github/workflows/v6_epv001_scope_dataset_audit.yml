name: v6-epv001-scope-dataset-audit

# Literature-only delivery audit. Uses the official public asset URL frozen from
# prior successful article-derived bridge audit; no article HTML rediscovery.
on:
  push:
    branches:
      - product-b-v5-obligate-invariant
    paths:
      - .github/workflows/v6_epv001_scope_dataset_audit.yml

permissions:
  contents: read

jobs:
  literature-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify repository tests before literature supplement access
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
      - name: Install XLS reader
        run: python -m pip install --disable-pip-version-check xlrd==2.0.1
      - name: Audit frozen EPV001 public supplement asset delivery
        env:
          PYTHONPATH: .
        run: python scripts/audit_v6_epv001_scope_dataset.py
      - name: Upload EPV001 literature scope audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-b-v6-epv001-scope-dataset-audit
          path: artifacts/product_b_v6_epv001_scope_dataset_audit.json
          if-no-files-found: error
          retention-days: 90
