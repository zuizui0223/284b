name: v7-2-jos002-host-taxonomy-bridge

on:
  push:
    branches:
      - product-b-v5-obligate-invariant
    paths:
      - .github/workflows/v7_2_jos002_host_taxonomy_bridge.yml

permissions:
  contents: read

jobs:
  taxonomy-bridge-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify repository tests before taxonomy bridge access
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
      - name: Audit JOS002 host current-taxonomy bridge only
        env:
          PYTHONPATH: .
        run: python scripts/audit_v7_2_jos002_host_taxonomy_bridge.py
      - name: Upload JOS002 host taxonomy bridge audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-b-v7-2-jos002-host-taxonomy-bridge
          path: artifacts/product_b_v7_2_jos002_host_taxonomy_bridge.json
          if-no-files-found: error
          retention-days: 90
