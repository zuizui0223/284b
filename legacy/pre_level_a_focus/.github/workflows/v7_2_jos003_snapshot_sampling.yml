name: v7-2-jos003-snapshot-sampling

on:
  push:
    branches:
      - product-b-v5-obligate-invariant
    paths:
      - .github/workflows/v7_2_jos003_snapshot_sampling.yml

permissions:
  contents: read

jobs:
  one-shot-snapshot-sampling:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify repository tests before snapshot row access
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
      - name: Install frozen snapshot scanner
        run: python -m pip install --disable-pip-version-check --quiet "pyarrow==21.0.0"
      - name: Execute frozen JOS003 snapshot sampling preflight once
        env:
          PYTHONPATH: .
        run: python scripts/run_v7_2_jos003_snapshot_sampling.py
      - name: Upload JOS003 snapshot sampling audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-b-v7-2-jos003-snapshot-sampling
          path: artifacts/product_b_v7_2_jos003_snapshot_sampling.json
          if-no-files-found: error
          retention-days: 90
