name: v7-3-neic001-snapshot-identity

on:
  push:
    branches:
      - product-b-v5-obligate-invariant
    paths:
      - .github/workflows/v7_3_neic001_snapshot_identity.yml

permissions:
  contents: read

jobs:
  taxonomy-identity-only:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify repository tests before snapshot taxonomy access
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
      - name: Install frozen snapshot scanner
        run: python -m pip install --disable-pip-version-check --quiet "pyarrow==21.0.0"
      - name: Execute frozen NEIC001 snapshot identity gate once
        env:
          PYTHONPATH: .
        run: python scripts/run_v7_3_neic001_snapshot_identity.py
      - name: Upload NEIC001 snapshot identity audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-b-v7-3-neic001-snapshot-identity
          path: artifacts/product_b_v7_3_neic001_snapshot_identity.json
          if-no-files-found: error
          retention-days: 90
