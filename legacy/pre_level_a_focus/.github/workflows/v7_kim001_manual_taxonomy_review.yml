name: v7-kim001-manual-taxonomy-review

on:
  push:
    branches:
      - product-b-v5-obligate-invariant
    paths:
      - .github/workflows/v7_kim001_manual_taxonomy_review.yml

permissions:
  contents: read

jobs:
  taxonomy-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify repository tests before manual taxonomy access
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
      - name: Resolve KIM001 host-name bridge only
        env:
          PYTHONPATH: .
        run: python scripts/run_v7_kim001_manual_taxonomy_review.py
      - name: Upload KIM001 manual taxonomy audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-b-v7-kim001-manual-taxonomy-review
          path: artifacts/product_b_v7_kim001_manual_taxonomy_review.json
          if-no-files-found: error
          retention-days: 90
