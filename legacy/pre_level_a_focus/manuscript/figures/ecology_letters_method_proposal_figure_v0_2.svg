<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<rect width="1200" height="800" fill="white"/>
<style>
text{font-family:Arial,sans-serif;fill:#111}.h{font-size:24px;font-weight:bold}.sh{font-size:18px;font-weight:bold}.b{font-size:15px}.s{font-size:13px}.n{font-size:28px;font-weight:bold}.box{fill:white;stroke:#222;stroke-width:1.5}.soft{fill:#f7f7f7;stroke:#555;stroke-width:1.2}.arrow{stroke:#222;stroke-width:1.8;fill:none;marker-end:url(#m)}
</style>
<defs><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#222"/></marker></defs>

<text x="50" y="44" class="h">Prospective relation endpoints for ecological answers</text>
<text x="50" y="72" class="b">Choose the biological relation first → construct independent answers → authorize the falsifying state</text>

<!-- A -->
<text x="50" y="118" class="sh">A  Different relations require different evidence</text>
<rect x="55" y="142" width="500" height="178" rx="10" class="soft"/>
<text x="75" y="170" class="sh">Level A — same target, independent source</text>
<rect x="85" y="192" width="150" height="52" rx="7" class="box"/><text x="160" y="214" class="b" text-anchor="middle">specimen records</text><text x="160" y="232" class="s" text-anchor="middle">answer 1</text>
<rect x="85" y="258" width="150" height="52" rx="7" class="box"/><text x="160" y="280" class="b" text-anchor="middle">observations</text><text x="160" y="298" class="s" text-anchor="middle">answer 2</text>
<line x1="235" y1="218" x2="350" y2="238" class="arrow"/><line x1="235" y1="284" x2="350" y2="258" class="arrow"/>
<rect x="355" y="212" width="165" height="72" rx="7" class="box"/><text x="437" y="238" class="b" text-anchor="middle">frozen coherence</text><text x="437" y="258" class="b" text-anchor="middle">relation</text><text x="437" y="277" class="s" text-anchor="middle">same target / estimand</text>

<rect x="590" y="142" width="555" height="178" rx="10" class="soft"/>
<text x="610" y="170" class="sh">Level C — directional biological dependency</text>
<rect x="620" y="194" width="118" height="50" rx="7" class="box"/><text x="679" y="216" class="b" text-anchor="middle">R</text><text x="679" y="234" class="s" text-anchor="middle">relation evidence</text>
<rect x="620" y="258" width="118" height="50" rx="7" class="box"/><text x="679" y="280" class="b" text-anchor="middle">X</text><text x="679" y="298" class="s" text-anchor="middle">event answer</text>
<rect x="760" y="258" width="118" height="50" rx="7" class="box"/><text x="819" y="280" class="b" text-anchor="middle">Y</text><text x="819" y="298" class="s" text-anchor="middle">function answer</text>
<line x1="738" y1="283" x2="912" y2="253" class="arrow"/><line x1="878" y1="283" x2="912" y2="260" class="arrow"/><line x1="738" y1="219" x2="912" y2="239" class="arrow"/>
<rect x="918" y="209" width="198" height="86" rx="7" class="box"/><text x="1017" y="232" class="b" text-anchor="middle">common event key k</text><text x="1017" y="254" class="b" text-anchor="middle">E(k) → F(k)</text><text x="1017" y="277" class="s" text-anchor="middle">hard call only if F=false</text><text x="1017" y="292" class="s" text-anchor="middle">is independently identifiable</text>

<!-- B -->
<text x="50" y="370" class="sh">B  Completed empirical anchor: fresh Level-A held-out closure</text>
<rect x="55" y="394" width="1090" height="142" rx="10" class="soft"/>
<rect x="90" y="424" width="210" height="78" rx="8" class="box"/><text x="195" y="449" class="n" text-anchor="middle">24 / 24</text><text x="195" y="473" class="b" text-anchor="middle">reference cells frozen</text><text x="195" y="492" class="s" text-anchor="middle">before held-out opening</text>
<line x1="300" y1="463" x2="415" y2="463" class="arrow"/>
<rect x="425" y="424" width="220" height="78" rx="8" class="box"/><text x="535" y="449" class="n" text-anchor="middle">288</text><text x="535" y="473" class="b" text-anchor="middle">held-out cells audited</text><text x="535" y="492" class="s" text-anchor="middle">12 taxa × 3 accessible areas × 8 procedures</text>
<line x1="645" y1="463" x2="750" y2="463" class="arrow"/>
<rect x="760" y="414" width="338" height="98" rx="8" class="box"/><text x="929" y="445" class="n" text-anchor="middle">283 / 283</text><text x="929" y="470" class="b" text-anchor="middle">opened cells inside frozen ceilings</text><text x="929" y="492" class="s" text-anchor="middle">5 inadequate cells remained unresolved</text>

<!-- C -->
<text x="50" y="585" class="sh">C  Exact benchmark: invalid observations cannot supply biological contradiction for free</text>
<rect x="55" y="608" width="1090" height="142" rx="10" class="soft"/>
<rect x="80" y="630" width="480" height="94" rx="8" class="box"/>
<text x="320" y="653" class="b" text-anchor="middle">For a qualified process with valid-key fraction a:</text>
<text x="320" y="679" class="sh" text-anchor="middle">FPRzero − FPRgated = 1 − a</text>
<text x="320" y="704" class="sh" text-anchor="middle">TPRzero − TPRgated = 1 − a</text>
<rect x="590" y="630" width="530" height="94" rx="8" class="box"/>
<text x="855" y="650" class="b" text-anchor="middle">Example: near-perfect valid-key detection + 30% missingness</text>
<text x="855" y="675" class="sh" text-anchor="middle">zero-collapsing FPR ≈ 0.300001</text>
<text x="855" y="699" class="sh" text-anchor="middle">gated FPR ≈ 1.1 × 10⁻⁶</text>
<text x="855" y="718" class="s" text-anchor="middle">the missing 30% remains unresolved rather than biological absence</text>

<text x="600" y="778" class="s" text-anchor="middle">No focal Level-C biological values are used in the benchmark or proposal figure.</text>
</svg>