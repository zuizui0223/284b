<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
<rect width="1200" height="900" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#111}.h{font-size:24px;font-weight:bold}.sh{font-size:18px;font-weight:bold}.b{font-size:14px}.s{font-size:12px}.xs{font-size:10.5px}.box{fill:white;stroke:#333;stroke-width:1.4}.soft{fill:#f7f7f7;stroke:#777;stroke-width:1.1}.arrow{stroke:#222;stroke-width:1.7;fill:none;marker-end:url(#m)}.dash{stroke:#777;stroke-width:1.3;stroke-dasharray:5 4;fill:none;marker-end:url(#m)}</style>
<defs><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#222"/></marker></defs>
<text x="45" y="40" class="h">Figure 1. Executable relation-endpoint contract</text>
<text x="45" y="68" class="b">Ecological estimators generate answers; the contract determines what joint relation those answers may test and when a state is admissible.</text>

<text x="45" y="112" class="sh">A  Five objects are frozen before focal comparison</text>
<rect x="50" y="132" width="1100" height="160" rx="10" class="soft"/>
<rect x="78" y="168" width="185" height="82" rx="7" class="box"/><text x="170" y="195" class="sh" text-anchor="middle">1  Relation</text><text x="170" y="220" class="s" text-anchor="middle">same-target coherence,</text><text x="170" y="238" class="s" text-anchor="middle">soft concordance, dependency</text>
<line x1="263" y1="209" x2="292" y2="209" class="arrow"/>
<rect x="300" y="168" width="185" height="82" rx="7" class="box"/><text x="392" y="195" class="sh" text-anchor="middle">2  Key space</text><text x="392" y="220" class="s" text-anchor="middle">where the biology applies</text><text x="392" y="238" class="s" text-anchor="middle">site × opportunity window</text>
<line x1="485" y1="209" x2="514" y2="209" class="arrow"/>
<rect x="522" y="168" width="185" height="82" rx="7" class="box"/><text x="614" y="195" class="sh" text-anchor="middle">3  Adapters</text><text x="614" y="220" class="s" text-anchor="middle">role-specific answer →</text><text x="614" y="238" class="s" text-anchor="middle">common relation space</text>
<line x1="707" y1="209" x2="736" y2="209" class="arrow"/>
<rect x="744" y="168" width="185" height="82" rx="7" class="box"/><text x="836" y="195" class="sh" text-anchor="middle">4  Adequacy</text><text x="836" y="220" class="s" text-anchor="middle">does each answer exist</text><text x="836" y="238" class="s" text-anchor="middle">for this endpoint?</text>
<line x1="929" y1="209" x2="958" y2="209" class="arrow"/>
<rect x="966" y="168" width="160" height="82" rx="7" class="box"/><text x="1046" y="195" class="sh" text-anchor="middle">5  Opening rule</text><text x="1046" y="220" class="s" text-anchor="middle">calibration / admissible</text><text x="1046" y="238" class="s" text-anchor="middle">endpoint states</text>

<text x="45" y="338" class="sh">B  Calibrated soft endpoint</text>
<rect x="50" y="358" width="530" height="218" rx="10" class="soft"/>
<rect x="82" y="392" width="170" height="62" rx="7" class="box"/><text x="167" y="418" class="b" text-anchor="middle">both answers adequate</text><text x="167" y="438" class="s" text-anchor="middle">+ frozen ceiling exists</text>
<line x1="252" y1="423" x2="312" y2="423" class="arrow"/>
<rect x="322" y="386" width="215" height="74" rx="7" class="box"/><text x="429" y="414" class="b" text-anchor="middle">discordance ≤ ceiling?</text><text x="429" y="438" class="s" text-anchor="middle">relation-specific comparison</text>
<line x1="429" y1="460" x2="429" y2="494" class="arrow"/>
<rect x="322" y="504" width="105" height="46" rx="6" class="box"/><text x="374" y="532" class="s" text-anchor="middle">consistent</text>
<rect x="438" y="504" width="115" height="46" rx="6" class="box"/><text x="495" y="525" class="xs" text-anchor="middle">attention_required</text><text x="495" y="541" class="xs" text-anchor="middle">≠ biological falsification</text>
<rect x="82" y="493" width="170" height="57" rx="6" class="box"/><text x="167" y="518" class="s" text-anchor="middle">inadequate / missing rule</text><text x="167" y="538" class="sh" text-anchor="middle">unresolved</text>

<text x="620" y="338" class="sh">C  Hard directional endpoint: E(k) → F(k)</text>
<rect x="625" y="358" width="525" height="218" rx="10" class="soft"/>
<rect x="650" y="387" width="145" height="58" rx="7" class="box"/><text x="722" y="412" class="b" text-anchor="middle">E adequate?</text><text x="722" y="431" class="s" text-anchor="middle">E(k)=true?</text>
<line x1="795" y1="416" x2="835" y2="416" class="arrow"/>
<rect x="843" y="382" width="170" height="68" rx="7" class="box"/><text x="928" y="407" class="b" text-anchor="middle">F state at same key</text><text x="928" y="429" class="s" text-anchor="middle">present / absent / unresolved</text>
<line x1="1013" y1="416" x2="1048" y2="416" class="arrow"/>
<rect x="1055" y="382" width="72" height="68" rx="7" class="box"/><text x="1091" y="404" class="xs" text-anchor="middle">qualified</text><text x="1091" y="420" class="xs" text-anchor="middle">process +</text><text x="1091" y="436" class="xs" text-anchor="middle">valid key?</text>
<rect x="650" y="490" width="143" height="58" rx="6" class="box"/><text x="721" y="512" class="xs" text-anchor="middle">E=false</text><text x="721" y="533" class="s" text-anchor="middle">noninformative_for_</text><text x="721" y="546" class="xs" text-anchor="middle">implication</text>
<rect x="805" y="490" width="145" height="58" rx="6" class="box"/><text x="877" y="512" class="xs" text-anchor="middle">F=present</text><text x="877" y="533" class="s" text-anchor="middle">no_observed_</text><text x="877" y="546" class="xs" text-anchor="middle">violation</text>
<rect x="962" y="490" width="165" height="58" rx="6" class="box"/><text x="1044" y="512" class="xs" text-anchor="middle">F=absent + qualified</text><text x="1044" y="533" class="sh" text-anchor="middle">hard_violation_</text><text x="1044" y="547" class="xs" text-anchor="middle">authorized</text>
<text x="888" y="568" class="s" text-anchor="middle">Any inadequate, unqualified or unresolved negative remains unresolved.</text>

<text x="45" y="632" class="sh">D  Relation ladder: increasing biological structure, not a universal common model</text>
<rect x="50" y="652" width="1100" height="190" rx="10" class="soft"/>
<rect x="75" y="690" width="185" height="108" rx="7" class="box"/><text x="167" y="715" class="sh" text-anchor="middle">Level A</text><text x="167" y="740" class="b" text-anchor="middle">same target</text><text x="167" y="762" class="s" text-anchor="middle">soft primitive implemented</text><text x="167" y="782" class="xs" text-anchor="middle">fresh empirical anchor</text>
<line x1="260" y1="744" x2="290" y2="744" class="arrow"/>
<rect x="298" y="690" width="185" height="108" rx="7" class="box"/><text x="390" y="715" class="sh" text-anchor="middle">Level B</text><text x="390" y="740" class="b" text-anchor="middle">soft cross-role</text><text x="390" y="762" class="s" text-anchor="middle">soft primitive implemented</text><text x="390" y="782" class="xs" text-anchor="middle">fresh endpoint unopened</text>
<line x1="483" y1="744" x2="513" y2="744" class="arrow"/>
<rect x="521" y="690" width="185" height="108" rx="7" class="box"/><text x="613" y="715" class="sh" text-anchor="middle">Level C</text><text x="613" y="740" class="b" text-anchor="middle">directional dependency</text><text x="613" y="762" class="s" text-anchor="middle">hard primitive implemented</text><text x="613" y="782" class="xs" text-anchor="middle">focal values sealed</text>
<line x1="706" y1="744" x2="736" y2="744" class="dash"/>
<rect x="744" y="690" width="185" height="108" rx="7" class="box"/><text x="836" y="715" class="sh" text-anchor="middle">Level D</text><text x="836" y="740" class="b" text-anchor="middle">mutual dependency</text><text x="836" y="762" class="s" text-anchor="middle">compose directional</text><text x="836" y="782" class="xs" text-anchor="middle">relation-specific extension</text>
<line x1="929" y1="744" x2="959" y2="744" class="dash"/>
<rect x="967" y="690" width="158" height="108" rx="7" class="box"/><text x="1046" y="715" class="sh" text-anchor="middle">Level E</text><text x="1046" y="740" class="b" text-anchor="middle">stage coupling</text><text x="1046" y="762" class="s" text-anchor="middle">compose primitives</text><text x="1046" y="782" class="xs" text-anchor="middle">biology frozen first</text>
<text x="600" y="865" class="s" text-anchor="middle">Reference implementation: relation_endpoint_contract.py. Different roles may use different upstream estimators, predictors, scales and accessible areas.</text>
</svg>
