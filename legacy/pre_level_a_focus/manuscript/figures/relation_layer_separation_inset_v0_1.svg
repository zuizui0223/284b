<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<rect width="1200" height="620" fill="white"/>
<style>
text{font-family:Arial,sans-serif;fill:#111}.h{font-size:25px;font-weight:bold}.sh{font-size:18px;font-weight:bold}.b{font-size:15px}.s{font-size:12px}.n{font-size:28px;font-weight:bold}.box{fill:white;stroke:#333;stroke-width:1.5}.soft{fill:#f7f7f7;stroke:#777;stroke-width:1.2}.arrow{stroke:#333;stroke-width:1.8;fill:none;marker-end:url(#m)}.cell{fill:white;stroke:#555;stroke-width:1.1}.hit{fill:#efefef;stroke:#333;stroke-width:1.2}</style>
<defs><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#333"/></marker></defs>

<text x="55" y="45" class="h">Perfect marginal answers do not identify a hard biological relation</text>
<text x="55" y="76" class="b">Classical Fréchet-Hoeffding coupling logic; used here only as a relation-layer separation argument.</text>

<rect x="405" y="105" width="390" height="105" rx="12" class="soft"/>
<text x="600" y="135" class="sh" text-anchor="middle">Same exact marginal answers</text>
<text x="600" y="174" class="n" text-anchor="middle">P(E=1)=0.5   ·   P(F=1)=0.5</text>
<text x="600" y="199" class="s" text-anchor="middle">assume both role-specific estimators are perfect</text>

<line x1="510" y1="210" x2="325" y2="270" class="arrow"/>
<line x1="690" y1="210" x2="875" y2="270" class="arrow"/>

<text x="300" y="284" class="sh" text-anchor="middle">World A — dependency compatible</text>
<text x="900" y="284" class="sh" text-anchor="middle">World B — dependency violated</text>

<!-- left 2x2 -->
<text x="300" y="318" class="b" text-anchor="middle">F state</text>
<text x="185" y="375" class="b" text-anchor="middle">E=0</text>
<text x="185" y="455" class="b" text-anchor="middle">E=1</text>
<text x="270" y="340" class="b" text-anchor="middle">F=0</text>
<text x="350" y="340" class="b" text-anchor="middle">F=1</text>
<rect x="230" y="350" width="80" height="80" class="hit"/><text x="270" y="398" class="n" text-anchor="middle">0.5</text>
<rect x="310" y="350" width="80" height="80" class="cell"/><text x="350" y="398" class="n" text-anchor="middle">0</text>
<rect x="230" y="430" width="80" height="80" class="cell"/><text x="270" y="478" class="n" text-anchor="middle">0</text>
<rect x="310" y="430" width="80" height="80" class="hit"/><text x="350" y="478" class="n" text-anchor="middle">0.5</text>
<text x="300" y="542" class="sh" text-anchor="middle">v=P(E=1,F=0)=0</text>
<text x="300" y="568" class="b" text-anchor="middle">E → F holds</text>

<!-- right 2x2 -->
<text x="900" y="318" class="b" text-anchor="middle">F state</text>
<text x="785" y="375" class="b" text-anchor="middle">E=0</text>
<text x="785" y="455" class="b" text-anchor="middle">E=1</text>
<text x="870" y="340" class="b" text-anchor="middle">F=0</text>
<text x="950" y="340" class="b" text-anchor="middle">F=1</text>
<rect x="830" y="350" width="80" height="80" class="cell"/><text x="870" y="398" class="n" text-anchor="middle">0</text>
<rect x="910" y="350" width="80" height="80" class="hit"/><text x="950" y="398" class="n" text-anchor="middle">0.5</text>
<rect x="830" y="430" width="80" height="80" class="hit"/><text x="870" y="478" class="n" text-anchor="middle">0.5</text>
<rect x="910" y="430" width="80" height="80" class="cell"/><text x="950" y="478" class="n" text-anchor="middle">0</text>
<text x="900" y="542" class="sh" text-anchor="middle">v=P(E=1,F=0)=0.5</text>
<text x="900" y="568" class="b" text-anchor="middle">E → F fails whenever E=1</text>

<rect x="415" y="525" width="370" height="70" rx="10" class="box"/>
<text x="600" y="553" class="sh" text-anchor="middle">Same answers · opposite relation status</text>
<text x="600" y="578" class="s" text-anchor="middle">Joint/event-key structure and biological relation semantics are a separate inferential layer.</text>
</svg>
