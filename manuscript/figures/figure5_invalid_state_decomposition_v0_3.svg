<text x="45" y="645" class="sh">D  Endpoint-state interpretation</text>
<rect x="50" y="665" width="1100" height="170" rx="10" class="soft"/>
<rect x="100" y="704" width="220" height="76" rx="7" class="box"/><text x="210" y="731" class="b" text-anchor="middle">Qualified observation</text><text x="210" y="754" class="b" text-anchor="middle">+ valid focal key</text>
<line x1="320" y1="742" x2="410" y2="742" class="heavy"/>
<rect x="420" y="704" width="250" height="76" rx="7" class="box"/><text x="545" y="731" class="b" text-anchor="middle">negative can enter</text><text x="545" y="754" class="b" text-anchor="middle">hard endpoint</text>
<rect x="780" y="695" width="300" height="92" rx="7" class="box"/><text x="930" y="720" class="b" text-anchor="middle">Invalid / missing / failed key</text><text x="930" y="745" class="sh" text-anchor="middle">must remain unresolved</text><text x="930" y="768" class="s" text-anchor="middle">zero collapsing deletes this state</text>
<text x="600" y="822" class="s" text-anchor="middle">The decomposition quantifies removing the unresolved-state guard; it does not replace occupancy, LIES, or other detection-aware models.</text>
