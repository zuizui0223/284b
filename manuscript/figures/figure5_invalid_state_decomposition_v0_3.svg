<text x="45" y="40" class="h">Figure 5. Exact cost of coercing invalid observation into a biological negative</text>
<text x="45" y="68" class="b">Zero collapsing is an ablation of the unresolved-state guard, not a competitor to detection-aware observation models.</text>

<text x="45" y="112" class="sh">A  General class-conditional decomposition</text>
<rect x="50" y="132" width="1100" height="145" rx="10" class="soft"/>
<text x="92" y="162" class="sh">Compatible keys (F=true)</text>
<text x="92" y="190" class="b">a₁ = P(valid | F=true)</text>
<text x="92" y="218" class="sh">FPRzero − FPRgated = 1 − a₁</text>
<text x="650" y="162" class="sh">True violations (F=false)</text>
<text x="650" y="190" class="b">a₀ = P(valid | F=false)</text>
<text x="650" y="218" class="sh">TPRzero − TPRgated = 1 − a₀</text>
<text x="600" y="258" class="b" text-anchor="middle">Equal-validity corollary: if a₁ = a₀ = a, both increments equal 1 − a.</text>

<text x="45" y="325" class="sh">B  State-dependent validity example</text>
<rect x="50" y="345" width="530" height="250" rx="10" class="soft"/>
