<text x="232" y="579" class="s" text-anchor="middle">False violation</text>
<rect x="395" y="406.35" width="38" height="133.65" rx="2" class="box"/><text x="414" y="400" class="xs" text-anchor="middle">0.891</text><text x="414" y="558" class="xs" text-anchor="middle">gated</text>
<rect x="450" y="391.35" width="38" height="148.65" rx="2" class="box"/><text x="469" y="385" class="xs" text-anchor="middle">0.991</text><text x="469" y="558" class="xs" text-anchor="middle">zero</text>
<text x="442" y="579" class="s" text-anchor="middle">True-violation sensitivity</text>

